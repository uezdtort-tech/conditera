# Single-container Supabase runtime overlay.
# Use together with docker-compose.yml and docker-compose.supabase.yml.
# The legacy multi-container Supabase services are disabled unless the
# explicit "legacy-supabase" profile is selected.
services:
  supabase-db:
    profiles: ["legacy-supabase"]
  supabase-kong:
    profiles: ["legacy-supabase"]
  supabase-auth:
    profiles: ["legacy-supabase"]
  supabase-rest:
    profiles: ["legacy-supabase"]
  supabase-realtime:
    profiles: ["legacy-supabase"]
  supabase-storage:
    profiles: ["legacy-supabase"]
  supabase-app-migrator:
    profiles: ["legacy-supabase"]
  supabase-imgproxy:
    profiles: ["legacy-supabase"]
  supabase-meta:
    profiles: ["legacy-supabase"]
  supabase-analytics:
    profiles: ["legacy-supabase"]
  supabase-vector:
    profiles: ["legacy-supabase"]

  supabase-runtime:
    build:
      context: .
      dockerfile: Dockerfile.supabase-runtime-poc
    image: conditera/supabase-runtime:pg17
    container_name: conditera-supabase-runtime
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_DB: supabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ANON_KEY: ${ANON_KEY:?ANON_KEY required}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE required}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?PG_META_CRYPTO_KEY required}
      REALTIME_DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?REALTIME_DB_ENC_KEY must be 16 characters}
      REALTIME_DB_ENC_KEY_GCM: ${REALTIME_DB_ENC_KEY_GCM:?REALTIME_DB_ENC_KEY_GCM must be 32 characters}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-https://conditera.ru/api}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-https://conditera.ru/api}
      SITE_URL: ${SITE_URL:-https://conditera.ru}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-noreply@conditera.ru}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Conditera}
      EXTERNAL_GOOGLE_ENABLED: ${EXTERNAL_GOOGLE_ENABLED:-false}
      EXTERNAL_GOOGLE_CLIENT_ID: ${EXTERNAL_GOOGLE_CLIENT_ID:-}
      EXTERNAL_GOOGLE_SECRET: ${EXTERNAL_GOOGLE_SECRET:-}
      EXTERNAL_YANDEX_ENABLED: ${EXTERNAL_YANDEX_ENABLED:-false}
      EXTERNAL_YANDEX_CLIENT_ID: ${EXTERNAL_YANDEX_CLIENT_ID:-}
      EXTERNAL_YANDEX_SECRET: ${EXTERNAL_YANDEX_SECRET:-}
      EXTERNAL_VK_ENABLED: ${EXTERNAL_VK_ENABLED:-false}
      EXTERNAL_VK_CLIENT_ID: ${EXTERNAL_VK_CLIENT_ID:-}
      EXTERNAL_VK_SECRET: ${EXTERNAL_VK_SECRET:-}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      STORAGE_TENANT_ID: ${STORAGE_TENANT_ID:-conditera}
      REGION: ${REGION:-eu-central-1}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-conditera-storage}
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP:-true}
    expose:
      - "8000"
      - "5432"
    volumes:
      - supabase_runtime_pg17_data:/opt/supabase/services/postgres/var/lib/postgresql/data
      - supabase_runtime_storage_data:/opt/supabase/services/storage/var/lib/storage
      - supabase_runtime_storage_data:/opt/supabase/services/imgproxy/var/lib/storage:ro
    networks:
      conditera-net:
        aliases:
          # Existing Caddyfile and internal app clients already target this
          # stable service DNS name; no split Supabase service is introduced.
          - supabase-kong
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  supabase_runtime_pg17_data:
  supabase_runtime_storage_data:
