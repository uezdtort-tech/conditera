name: Одноразовое обновление bun.lock для Next.js 16.4.6

on:
  push:
    branches:
      - fix/production-readiness-2026-11-23
    paths:
      - "package.json"
      - ".github/workflows/refresh-bun-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Пересобрать lockfile без запуска install scripts
        run: |
          bun --version
          bun install --lockfile-only
          git diff --check
          git diff --exit-code -- package.json

      - name: Зафиксировать lockfile и удалить одноразовый workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock did not change after dependency update"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/refresh-bun-lock.yml
          git commit -m "chore(deps): regenerate bun.lock for Next.js 16.4.6 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
