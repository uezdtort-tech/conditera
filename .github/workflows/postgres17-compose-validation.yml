name: PostgreSQL 17 migration Compose validation

on:
  push:
    branches:
      - work/pg17-single-postgres-current-main
    paths:
      - "docker-compose.supabase.yml"
      - "docker-compose.pg17-migration.yml"
      - "supabase/config.toml"
      - ".github/workflows/postgres17-compose-validation.yml"
  pull_request:
    paths:
      - "docker-compose.supabase.yml"
      - "docker-compose.pg17-migration.yml"
      - "supabase/config.toml"
      - ".github/workflows/postgres17-compose-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-jwt-secret-which-is-long-enough-for-compose-validation
      ANON_KEY: ci-only-anon-key
      SERVICE_ROLE_KEY: ci-only-service-role-key
      ENCRYPTOR_KEY: ci-only-encryptor-key
      SECRET_KEY_BASE: ci-only-secret-key-base
    steps:
      - uses: actions/checkout@v4
      - name: Проверить доступность Docker Compose
        run: docker compose version
      - name: Проверить объединённую конфигурацию Supabase + PG17
        run: |
          docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration config --quiet
      - name: Проверить изоляцию целевого кластера и сохранность действующего PG15
        run: |
          docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration config --format json > /tmp/conditera-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/conditera-compose.json").read_text())
          services = config["services"]
          target = services["supabase-db-pg17-migration"]
          current = services["supabase-db"]

          assert target.get("image") == "supabase/postgres:17.12.0.001", f"PG17 image: {target.get('image')}"
          assert "pg17-migration" in target.get("profiles", []), f"PG17 profile: {target.get('profiles')}"
          assert not target.get("ports"), f"PG17 host ports must be absent: {target.get('ports')}"
          target_data = [v for v in target.get("volumes", []) if v.get("target") == "/var/lib/postgresql/data"]
          current_data = [v for v in current.get("volumes", []) if v.get("target") == "/var/lib/postgresql/data"]
          assert len(target_data) == 1, f"PG17 data mounts: {target.get('volumes')}"
          assert len(current_data) == 1, f"PG15 data mounts: {current.get('volumes')}"
          assert target_data[0]["source"] == "supabase_pg17_migration_data", f"PG17 volume mount: {target_data[0]}"
          assert current.get("image") == "supabase/postgres:15.6.1.141", f"Existing PG15 image changed: {current.get('image')}"
          assert current_data[0]["source"] != target_data[0]["source"], "PG15 and PG17 must never share a data volume"
          assert config["volumes"]["supabase_pg17_migration_data"]["name"] == "conditera_supabase_pg17_migration_data", f"PG17 named volume: {config['volumes']['supabase_pg17_migration_data']}"
          assert config["networks"]["pg17-migration-net"]["internal"] is True, "PG17 migration network must be internal"
          assert all(not str(v.get("source", "")).startswith("./supabase/") for v in target.get("volumes", [])), f"Target must not run app init scripts: {target.get('volumes')}"
          print("OK: PG17 target is profile-isolated, has a separate volume, and current PG15 remains unchanged.")
          PY
