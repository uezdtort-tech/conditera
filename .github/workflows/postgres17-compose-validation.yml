name: PostgreSQL 17 migration Compose validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/pg17-compose-validation-and-import
    paths:
      - "docker-compose.supabase.yml"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "Caddyfile"
      - "docker-compose.supabase-single-container.yml"
      - "Dockerfile"
      - "Dockerfile.supabase-runtime-poc"
      - "scripts/deploy-single-container.sh"
      - "scripts/prepare-production-env.sh"
      - ".env.production.example"
      - ".env.supabase-runtime.example"
      - "docker-compose.pg17-migration.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/init-scripts/**"
      - "supabase/init-scripts/00-service-role-passwords.sh"
      - "scripts/ops/restore-app-dump-to-pg17-shadow.sh"
      - ".github/workflows/postgres17-compose-validation.yml"
  pull_request:
    paths:
      - "docker-compose.supabase.yml"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "Caddyfile"
      - "docker-compose.supabase-single-container.yml"
      - "Dockerfile"
      - "Dockerfile.supabase-runtime-poc"
      - "scripts/deploy-single-container.sh"
      - "scripts/prepare-production-env.sh"
      - ".env.production.example"
      - ".env.supabase-runtime.example"
      - "docker-compose.pg17-migration.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/init-scripts/**"
      - "scripts/ops/restore-app-dump-to-pg17-shadow.sh"
      - ".github/workflows/postgres17-compose-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-at-least-32-characters
      JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
      SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
      ENCRYPTOR_KEY: 0123456789abcdef0123456789abcdef
      SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PG_META_CRYPTO_KEY: 0123456789abcdef0123456789abcdef
      REALTIME_DB_ENC_KEY: 0123456789abcdef
      REALTIME_DB_ENC_KEY_GCM: 0123456789abcdef0123456789abcdef
      N8N_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Проверить доступность Docker Compose
        run: docker compose version
      - name: Проверить безопасный production overlay и deploy gate
        run: |
          set -Eeuo pipefail
          trap 'rm -f .env.production .env.supabase-runtime .secrets/n8n_encryption_key; rmdir .secrets 2>/dev/null || true' EXIT
          make_test_jwt() {
            python3 - "$JWT_SECRET" "$1" <<'PY'
          import base64, hashlib, hmac, json, sys, time
          secret, role = sys.argv[1], sys.argv[2]
          def b64(value):
              return base64.urlsafe_b64encode(value).decode().rstrip("=")
          header = b64(json.dumps({"alg":"HS256","typ":"JWT"}, separators=(",",":")).encode())
          now = int(time.time())
          payload = b64(json.dumps({"iss":"supabase-demo","role":role,"iat":now,"exp":now+315360000}, separators=(",",":")).encode())
          message = f"{header}.{payload}"
          signature = b64(hmac.new(secret.encode(), message.encode(), hashlib.sha256).digest())
          print(f"{message}.{signature}")
          PY
          }
          ANON_KEY="$(make_test_jwt anon)"
          SERVICE_ROLE_KEY="$(make_test_jwt service_role)"
          VAPID_KEYS="$(node -e 'const {createECDH}=require("node:crypto"); const e=createECDH("prime256v1"); e.generateKeys(); console.log(e.getPublicKey(null,"uncompressed").toString("base64url")); console.log(e.getPrivateKey().toString("base64url"));')"
          VAPID_PUBLIC_KEY="$(printf '%s\n' "$VAPID_KEYS" | sed -n '1p')"
          VAPID_PRIVATE_KEY="$(printf '%s\n' "$VAPID_KEYS" | sed -n '2p')"
          cat > .env.production <<EOF
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          JWT_REFRESH_SECRET=ci-refresh-secret-which-is-not-used-for-real-auth
          TFA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CRON_SECRET=ci-cron-secret-for-compose-validation
          N8N_WEBHOOK_SECRET=ci-n8n-webhook-secret-for-compose-validation
          BOT_SECRET=ci-bot-secret-for-compose-validation
          IP_HASH_SALT=ci-ip-hash-salt
          MEILI_MASTER_KEY=ci-meili-master-key-32-characters-long
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_FROM=noreply@conditera.ru
          SMTP_USER=ci-smtp-user
          SMTP_PASSWORD=ci-smtp-password
          SMTP_TLS_REJECT_UNAUTHORIZED=true
          YOOKASSA_SHOP_ID=ci-shop-id
          YOOKASSA_SECRET_KEY=live_ci_yookassa_secret
          YANDEX_CLIENT_ID=ci-yandex-client
          YANDEX_CLIENT_SECRET=ci-yandex-secret
          YANDEX_OAUTH_REDIRECT=https://conditera.ru/api/auth/oauth/yandex/callback
          VK_CLIENT_ID=ci-vk-client
          VK_OAUTH_REDIRECT=https://conditera.ru/api/auth/oauth/vk/callback
          TELEGRAM_BOT_TOKEN=123456:ci-telegram-token
          TELEGRAM_CHANNEL_ID=@conditera-ci
          TELEGRAM_WEBHOOK_SECRET=ci-telegram-webhook-secret
          VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
          VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
          NEXT_PUBLIC_APP_URL=https://conditera.ru
          NEXT_PUBLIC_SUPABASE_URL=https://conditera.ru/api
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EXTERNAL_YANDEX_ENABLED=false
          EXTERNAL_VK_ENABLED=false
          ENCRYPTOR_KEY=$ENCRYPTOR_KEY
          SECRET_KEY_BASE=$SECRET_KEY_BASE
          SIMPLEX_BRIDGE_API_KEY=ci-simplex-bridge-key
          EOF
          cat > .env.supabase-runtime <<EOF
          APP_DATABASE_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BACKUP_DATABASE_PASSWORD=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY
          SUPABASE_SECRET_KEY_BASE=$SECRET_KEY_BASE
          PG_META_CRYPTO_KEY=$PG_META_CRYPTO_KEY
          REALTIME_DB_ENC_KEY=$REALTIME_DB_ENC_KEY
          REALTIME_DB_ENC_KEY_GCM=$REALTIME_DB_ENC_KEY_GCM
          EOF
          mkdir -p .secrets
          printf '%s\n' "$N8N_ENCRYPTION_KEY" > .secrets/n8n_encryption_key
          chmod 644 .secrets/n8n_encryption_key
          bash -n scripts/deploy-single-container.sh
          bash -n scripts/prepare-production-env.sh
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/scripts"
          cp scripts/prepare-production-env.sh "$tmpdir/scripts/"
          cp .env.production.example .env.supabase-runtime.example .gitignore "$tmpdir/"
          git -C "$tmpdir" init -q
          (cd "$tmpdir" && bash scripts/prepare-production-env.sh >/dev/null)
          first_hash="$(sha256sum "$tmpdir/.env.production" "$tmpdir/.env.supabase-runtime" "$tmpdir/.secrets/n8n_encryption_key")"
          (cd "$tmpdir" && bash scripts/prepare-production-env.sh >/dev/null)
          second_hash="$(sha256sum "$tmpdir/.env.production" "$tmpdir/.env.supabase-runtime" "$tmpdir/.secrets/n8n_encryption_key")"
          test "$first_hash" = "$second_hash"
          python3 - "$tmpdir" <<'PY'
          from pathlib import Path
          import re
          import sys
          root = Path(sys.argv[1])
          runtime = {}
          for line in (root / ".env.supabase-runtime").read_text().splitlines():
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  runtime[key] = value
          secret_path = root / ".secrets/n8n_encryption_key"
          secret = secret_path.read_bytes()
          expected = runtime["N8N_ENCRYPTION_KEY"].encode() + b"\n"
          if secret != expected:
              raise SystemExit("n8n encryption secret file must contain exactly the generated key followed by one newline")
          if not re.fullmatch(r"[0-9a-f]{64}", runtime["N8N_ENCRYPTION_KEY"]):
              raise SystemExit("generated n8n encryption key must be 64 lowercase hex characters")
          if (root / ".env.production").stat().st_mode & 0o777 != 0o600:
              raise SystemExit(".env.production must be mode 0600")
          if (root / ".env.supabase-runtime").stat().st_mode & 0o777 != 0o600:
              raise SystemExit(".env.supabase-runtime must be mode 0600")
          print("Production env bootstrap PASS: idempotent secrets, exact n8n key-file bytes, and restrictive permissions.")
          PY
          rm -rf "$tmpdir"
          bash scripts/deploy-single-container.sh --config
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose -f docker-compose.dev.yml config --format json > /tmp/conditera-dev-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          services = json.loads(Path("/tmp/conditera-dev-compose.json").read_text())["services"]
          assert services["db-dev"]["image"] == "postgres:17-alpine"
          assert services["n8n-dev"]["image"] == "n8nio/n8n:2.48.7"
          ports = services["n8n-dev"]["ports"]
          assert len(ports) == 1 and ports[0].get("host_ip") == "127.0.0.1"
          print("Development Compose PASS: PostgreSQL 17 and local-only n8n.")
          PY
      - name: Проверить объединённую конфигурацию Supabase + PG17
        run: |
          docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration config --quiet
      - name: Проверить изоляцию целевого кластера и сохранность действующего PG15
        run: |
          docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration config --format json > /tmp/conditera-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/conditera-compose.json").read_text())
          services = config["services"]
          target = services["supabase-db-pg17-migration"]
          current = services["supabase-db"]

          assert target["image"] == "supabase/postgres:17.12.0.001", target.get("image")
          assert "pg17-migration" in target.get("profiles", []), target.get("profiles")
          assert target.get("ports") in (None, []), target.get("ports")
          isolated_network = config["networks"]["pg17-migration-net"]
          assert isolated_network.get("internal") is True, isolated_network
          pg17_services = [name for name in services if name.endswith("-pg17-migration")]
          assert len(pg17_services) == 7, pg17_services
          for name in pg17_services:
              service_networks = services[name].get("networks", {})
              assert set(service_networks) == {"pg17-migration-net"}, (name, service_networks)
          target_named_volumes = [volume["source"] for volume in target.get("volumes", []) if volume.get("type") == "volume"]
          storage = services["supabase-storage-pg17-migration"]
          storage_named_volumes = [volume["source"] for volume in storage.get("volumes", []) if volume.get("type") == "volume"]
          current_named_volumes = [volume["source"] for volume in current.get("volumes", []) if volume.get("type") == "volume"]
          assert "supabase_pg17_migration_data" in target_named_volumes, target_named_volumes
          assert current["image"] == "supabase/postgres:15.6.1.141", current.get("image")
          assert "supabase_db_data" in current_named_volumes, current_named_volumes
          assert set(current_named_volumes).isdisjoint(target_named_volumes), (current_named_volumes, target_named_volumes)
          assert config["volumes"]["supabase_pg17_migration_data"]["name"] == "conditera_supabase_pg17_migration_data"
          assert "supabase_pg17_migration_storage_data" in storage_named_volumes, storage_named_volumes
          assert config["volumes"]["supabase_pg17_migration_storage_data"]["name"] == "conditera_supabase_pg17_migration_storage_data"
          print("OK: PG17 target is profile-isolated, has a separate volume, and current PG15 remains unchanged.")
          PY
      - name: Запустить PG17 и Supabase Storage, затем применить отложенную миграцию
        run: |
          COMPOSE="docker compose -f docker-compose.supabase.yml -f docker-compose.pg17-migration.yml --profile pg17-migration"
          if ! $COMPOSE up -d supabase-storage-pg17-migration supabase-auth-pg17-migration supabase-realtime-pg17-migration; then
            docker logs conditera-supabase-db-pg17-migration || true
            docker logs conditera-supabase-rest-pg17-migration || true
            docker logs conditera-supabase-meta-pg17-migration || true
            docker logs conditera-supabase-storage-pg17-migration || true
            docker logs conditera-supabase-auth-pg17-migration || true
            docker logs conditera-supabase-realtime-pg17-migration || true
            exit 1
          fi
          READY=0
          for attempt in $(seq 1 90); do
            DB_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' conditera-supabase-db-pg17-migration 2>/dev/null || echo missing)
            STORAGE_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' conditera-supabase-storage-pg17-migration 2>/dev/null || echo missing)
            AUTH_STATE=$(docker inspect -f '{{.State.Status}}' conditera-supabase-auth-pg17-migration 2>/dev/null || echo missing)
            REALTIME_STATE=$(docker inspect -f '{{.State.Status}}' conditera-supabase-realtime-pg17-migration 2>/dev/null || echo missing)
            if [ "$AUTH_STATE" = "exited" ] || [ "$REALTIME_STATE" = "exited" ] || [ "$AUTH_STATE" = "dead" ] || [ "$REALTIME_STATE" = "dead" ] || [ "$AUTH_STATE" = "restarting" ] || [ "$REALTIME_STATE" = "restarting" ]; then
              docker logs conditera-supabase-auth-pg17-migration || true
              docker logs conditera-supabase-realtime-pg17-migration || true
              exit 1
            fi
            if [ "$STORAGE_HEALTH" = "unhealthy" ]; then
              docker inspect -f 'DB_HEALTH={{json .State.Health}}' conditera-supabase-db-pg17-migration || true
              docker inspect -f 'STORAGE_HEALTH={{json .State.Health}}' conditera-supabase-storage-pg17-migration || true
              docker logs conditera-supabase-rest-pg17-migration || true
              docker logs conditera-supabase-meta-pg17-migration || true
              docker logs conditera-supabase-storage-pg17-migration || true
              docker logs conditera-supabase-auth-pg17-migration || true
              docker logs conditera-supabase-realtime-pg17-migration || true
              exit 1
            fi
            if [ "$DB_HEALTH" = "healthy" ] && [ "$STORAGE_HEALTH" = "healthy" ]; then
              READY=1
              break
            fi
            sleep 5
          done
          if [ "$READY" != "1" ]; then
            docker inspect -f 'DB_HEALTH={{json .State.Health}}' conditera-supabase-db-pg17-migration || true
            docker inspect -f 'STORAGE_HEALTH={{json .State.Health}}' conditera-supabase-storage-pg17-migration || true
            docker logs conditera-supabase-storage-pg17-migration || true
            docker logs conditera-supabase-auth-pg17-migration || true
            docker logs conditera-supabase-realtime-pg17-migration || true
            exit 1
          fi
          REST_STATUS=$(docker run --rm --network container:conditera-supabase-rest-pg17-migration curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/ || true)
          if ! [[ "$REST_STATUS" =~ ^(2[0-9]{2}|404)$ ]]; then
            echo "PostgREST did not become reachable (HTTP $REST_STATUS)."
            docker logs conditera-supabase-rest-pg17-migration || true
            exit 1
          fi
          if ! docker run --rm --network container:conditera-supabase-meta-pg17-migration curlimages/curl:8.12.1 -fsS --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health >/dev/null; then docker logs conditera-supabase-meta-pg17-migration || true; exit 1; fi
          if ! docker run --rm --network container:conditera-supabase-auth-pg17-migration curlimages/curl:8.12.1 -fsS --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:9999/health >/dev/null; then docker logs conditera-supabase-auth-pg17-migration || true; exit 1; fi
          REALTIME_STATUS=$(docker run --rm --network container:conditera-supabase-realtime-pg17-migration curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:4000/api/health || true)
          if ! [[ "$REALTIME_STATUS" =~ ^(2[0-9]{2}|404)$ ]]; then
            echo "Realtime HTTP endpoint did not respond as expected (HTTP $REALTIME_STATUS)."
            docker logs conditera-supabase-realtime-pg17-migration || true
            exit 1
          fi
          REALTIME_MIGRATIONS=$(docker compose -f docker-compose.supabase.yml -f docker-compose.pg17-migration.yml --profile pg17-migration exec -T supabase-db-pg17-migration psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc "SELECT to_regclass('_realtime.schema_migrations') IS NOT NULL;")
          test "$REALTIME_MIGRATIONS" = "t"
          if ! $COMPOSE up -d supabase-app-migrator-pg17-migration; then
            docker logs conditera-supabase-app-migrator-pg17-migration || true
            exit 1
          fi
          for attempt in $(seq 1 90); do
            MIGRATOR_STATE=$(docker inspect -f '{{.State.Status}}' conditera-supabase-app-migrator-pg17-migration 2>/dev/null || echo missing)
            if [ "$MIGRATOR_STATE" = "exited" ]; then
              EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' conditera-supabase-app-migrator-pg17-migration)
              if [ "$EXIT_CODE" = "0" ]; then
                exit 0
              fi
              docker logs conditera-supabase-app-migrator-pg17-migration || true
              exit 1
            fi
            sleep 5
          done
          docker logs conditera-supabase-app-migrator-pg17-migration || true
          echo "PG17 application migration runner did not finish within 450 seconds."
          exit 1
      - name: Проверить PostgreSQL 17, Supabase Auth, Storage и прикладные миграции
        run: |
          docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration exec -T supabase-db-pg17-migration \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc \
            "SELECT current_setting('server_version_num')::int BETWEEN 170000 AND 179999 AND to_regclass('auth.users') IS NOT NULL AND to_regclass('public.schema_migrations') IS NOT NULL AND to_regclass('storage.buckets') IS NOT NULL AND to_regclass('storage.objects') IS NOT NULL;" | grep -qx t
          MIGRATIONS=$(docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration exec -T supabase-db-pg17-migration \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc \
            "SELECT count(*) FROM public.schema_migrations;")
          test "$MIGRATIONS" -gt 0
          STORAGE_MIGRATION=$(docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration exec -T supabase-db-pg17-migration \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc \
            "SELECT count(*) FROM public.schema_migrations WHERE filename='0026_storage_buckets_and_confectioners_rls.sql';")
          test "$STORAGE_MIGRATION" = "1"
          BUCKETS=$(docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration exec -T supabase-db-pg17-migration \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc \
            "SELECT count(*) FROM storage.buckets WHERE id IN ('avatars','covers','portfolio','product_images','documents','messages','order_media');")
          test "$BUCKETS" = "7"
          ORDER_MEDIA_PRIVATE=$(docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration exec -T supabase-db-pg17-migration \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc \
            "SELECT count(*) FROM storage.buckets WHERE id='order_media' AND public=FALSE AND allowed_mime_types @> ARRAY['image/jpeg','image/png','image/webp']::text[];")
          test "$ORDER_MEDIA_PRIVATE" = "1"
          for table in profiles user_roles products orders inventory_items chat_channels oauth_identity_links user_consent_events; do
            docker compose \
              -f docker-compose.supabase.yml \
              -f docker-compose.pg17-migration.yml \
              --profile pg17-migration exec -T supabase-db-pg17-migration \
              psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase -Atc \
              "SELECT to_regclass('public.$table') IS NOT NULL;" | grep -qx t
          done
          echo "PG17 schema migrations: $MIGRATIONS; Storage migration: $STORAGE_MIGRATION; buckets: $BUCKETS; private order media: $ORDER_MEDIA_PRIVATE"
      - name: Проверить логический перенос дампа PostgreSQL 18 в теневую БД PostgreSQL 17
        run: |
          docker run -d --name conditera-pg18-source \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=conditera_source \
            postgres:18-alpine
          READY=0
          for attempt in $(seq 1 30); do
            if docker exec conditera-pg18-source pg_isready -U postgres -d conditera_source >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = "1"
          docker exec -i conditera-pg18-source psql -X -v ON_ERROR_STOP=1 -U postgres -d conditera_source <<'SQL'
          CREATE TABLE public.profiles (id text PRIMARY KEY);
          CREATE TABLE public.user_roles (id text PRIMARY KEY);
          CREATE TABLE public.products (id text PRIMARY KEY);
          CREATE TABLE public.orders (id text PRIMARY KEY);
          CREATE TABLE public.inventory_items (id text PRIMARY KEY);
          CREATE TABLE public.chat_channels (id text PRIMARY KEY);
          CREATE TABLE public.oauth_identity_links (id text PRIMARY KEY);
          CREATE TABLE public.user_consent_events (id text PRIMARY KEY);
          CREATE TABLE public.schema_migrations (version text PRIMARY KEY);
          INSERT INTO public.schema_migrations VALUES ('0001');
          CREATE TABLE public.migration_smoke (id integer PRIMARY KEY, payload text NOT NULL);
          INSERT INTO public.migration_smoke VALUES (1, 'PG18-to-PG17'), (2, 'logical-restore-ok');
          SQL
          docker exec conditera-pg18-source pg_dump -Fc -U postgres -d conditera_source > /tmp/conditera-pg18-app.dump
          test -s /tmp/conditera-pg18-app.dump
          PG17_MIGRATION_MODE=1 \
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            APP_DUMP_FILE=/tmp/conditera-pg18-app.dump \
            PG17_CONTAINER=conditera-supabase-db-pg17-migration \
            PG17_USER=supabase_admin \
            STAGING_DATABASE=conditera_app_shadow \
            PG_RESTORE_IMAGE=postgres:18-alpine \
            bash scripts/ops/restore-app-dump-to-pg17-shadow.sh
          ROWS=$(docker exec conditera-supabase-db-pg17-migration \
            psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d conditera_app_shadow -Atc \
            "SELECT count(*) FROM public.migration_smoke WHERE payload IN ('PG18-to-PG17','logical-restore-ok');")
          test "$ROWS" = "2"
          echo "OK: PostgreSQL 18 custom dump restored into an isolated PostgreSQL 17 database."
      - name: Проверить RLS разрезов на отдельном PostgreSQL 17
        run: |
          docker run -d --name product-slices-rls-pg \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=conditera \
            postgres:17-alpine
          READY=0
          for attempt in $(seq 1 30); do
            if docker exec product-slices-rls-pg pg_isready -U postgres -d conditera >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = "1"
          docker exec -i product-slices-rls-pg psql -v ON_ERROR_STOP=1 -U postgres -d conditera < scripts/tests/product-slices-rls-setup.sql
          docker exec -i product-slices-rls-pg psql -v ON_ERROR_STOP=1 -U postgres -d conditera < supabase/migrations/0064_product_slices_rls.sql
          docker exec -i product-slices-rls-pg psql -v ON_ERROR_STOP=1 -U postgres -d conditera < scripts/tests/product-slices-rls-regression.sql
      - name: Очистить только временный кластер GitHub Actions
        if: always()
        run: |
          docker rm -fv product-slices-rls-pg >/dev/null 2>&1 || true
          docker rm -fv conditera-pg18-source >/dev/null 2>&1 || true
          docker compose \
            -f docker-compose.supabase.yml \
            -f docker-compose.pg17-migration.yml \
            --profile pg17-migration down --volumes --remove-orphans || true
