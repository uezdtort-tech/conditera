name: PostgreSQL 17 — unified runtime Compose validation

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.supabase.yml"
      - "docker-compose.supabase-single-container.yml"
      - "docker-compose.dev.yml"
      - "scripts/compose-single-runtime.mjs"
      - "scripts/supabase-runtime-poc/start-app-migrations.sh"
      - "scripts/deploy.sh"
      - "scripts/init-db.sh"
      - ".env.supabase-runtime.example"
      - ".github/workflows/postgres17-compose-validation.yml"
  workflow_dispatch:

concurrency:
  group: postgres17-compose-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate single PostgreSQL 17 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      APP_DATABASE_PASSWORD: ci-only-app-db-password
      BACKUP_DATABASE_PASSWORD: ci-only-backup-db-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      ENCRYPTOR_KEY: ci-only-encryptor-key-32-chars
      SECRET_KEY_BASE: ci-only-secret-key-base-64-characters-long
      ANON_KEY: ci-only-anon-key
      SERVICE_ROLE_KEY: ci-only-service-role-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-key
      SUPABASE_SECRET_KEY_BASE: ci-only-secret-key-base-64-characters-long
      PG_META_CRYPTO_KEY: ci-only-pg-meta-crypto-key-32
      REALTIME_DB_ENC_KEY: ci-only-key-16
      REALTIME_DB_ENC_KEY_GCM: ci-only-key-gcm-32-characters
      MEILI_MASTER_KEY: ci-only-meili-master-key
      CRON_SECRET: ci-only-cron-secret
      N8N_ADMIN_EMAIL: ci-only-admin@conditera.test
      N8N_ADMIN_PASSWORD: CI-N8N-Owner-2026!
      N8N_ENCRYPTION_KEY: ci-only-n8n-encryption-key-32
      N8N_WEBHOOK_SECRET: ci-only-n8n-webhook-secret-64-characters-long
      SIMPLEX_BRIDGE_API_KEY: ci-only-simplex-key
    steps:
      - uses: actions/checkout@v7

      - name: Проверить синтаксис локальных launchers
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy.sh
          bash -n scripts/init-db.sh
          node --check scripts/compose-single-runtime.mjs
          node --check scripts/start-standalone.mjs

      - name: Проверить Compose без старых баз и без запуска контейнеров
        shell: bash
        run: |
          set -Eeuo pipefail
          touch .env.production .env.supabase-runtime
          trap 'rm -f .env.production .env.supabase-runtime' EXIT

          # Старые Compose-файлы оставлены для обратной совместимости.
          # Они должны разбираться, но любой PostgreSQL-образ в них обязан быть PG17.
          docker compose -f docker-compose.yml config --format json > /tmp/conditera-legacy-app.json
          docker compose -f docker-compose.supabase.yml config --format json > /tmp/conditera-legacy-supabase.json
          python3 - <<'PY'
          import json, re
          for path in ("/tmp/conditera-legacy-app.json", "/tmp/conditera-legacy-supabase.json"):
              with open(path, encoding="utf-8") as stream:
                  config = json.load(stream)
              for name, service in config["services"].items():
                  image = str(service.get("image", ""))
                  if "postgres" not in image.lower():
                      continue
                  match = re.search(r":(\\d+)(?:\\.|-|$)", image)
                  assert match, f"{path}: unpinned PostgreSQL image for {name}: {image}"
                  assert int(match.group(1)) == 17, f"{path}: PostgreSQL major mismatch for {name}: {image}"
          print("PASS: retained Compose files parse and use only PostgreSQL 17 images.")
          PY

          node scripts/compose-single-runtime.mjs config
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.supabase.yml \
            -f docker-compose.supabase-single-container.yml \
            config --format json > /tmp/conditera-compose.json

          python3 - <<'PY'
          import json
          with open("/tmp/conditera-compose.json", encoding="utf-8") as stream:
              config = json.load(stream)
          services = config["services"]
          required = {"web", "supabase-runtime"}
          missing = required - set(services)
          assert not missing, f"Missing required services: {sorted(missing)}"
          forbidden = {
              "db", "pgbouncer", "migrator", "supabase-db", "supabase-kong",
              "supabase-auth", "supabase-rest", "supabase-realtime",
              "supabase-storage", "supabase-app-migrator"
          }
          active_legacy = forbidden & set(services)
          assert not active_legacy, f"Legacy DB/services are active: {sorted(active_legacy)}"
          web = services["web"]
          assert "supabase-runtime" in web["depends_on"]
          assert "postgresql://conditera_app:" in web["environment"]["DATABASE_URL"]
          assert "@supabase-runtime:5432/supabase" in web["environment"]["DATABASE_URL"]
          assert "supabase-runtime:5432/supabase" in web["environment"]["DIRECT_DATABASE_URL"]
          assert web["environment"]["SUPABASE_INTERNAL_URL"] == "http://supabase-kong:8000"
          assert "supabase_runtime_pg17_data" in config["volumes"]
          assert "supabase_runtime_storage_data" in config["volumes"]
          assert "supabase_runtime_deno_cache" in config["volumes"]
          assert "conditera_backup_data" in config["volumes"]
          assert "conditera_backup:" in web["environment"]["BACKUP_DATABASE_URL"]
          assert any(v.get("target") == "/app/backups" and "conditera_backup_data" in v.get("source", "") for v in web.get("volumes", []))
          runtime = services["supabase-runtime"]
          assert "postgres:17" in runtime["image"] or "17.12" in runtime["image"] or runtime.get("build")
          print("PASS: unified Supabase Runtime / PostgreSQL 17 is the only active database; app and Supabase API use the same cluster.")
          PY

          # Launcher must reject legacy profiles and destructive volume deletion.
          if node scripts/compose-single-runtime.mjs --profile legacy-supabase config; then
            echo "Launcher accepted forbidden legacy-supabase profile" >&2
            exit 1
          fi
          if node scripts/compose-single-runtime.mjs down --volumes; then
            echo "Launcher accepted destructive volume removal" >&2
            exit 1
          fi
