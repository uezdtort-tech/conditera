name: Embedded PostgreSQL 17 runtime validation

on:
  push:
    branches:
      - fix/postgres17-supabase-consolidation
    paths:
      - "package.json"
      - "bun.lock"
      - "scripts/db/runtime.mjs"
      - ".github/workflows/embedded-pg17-runtime.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "scripts/db/runtime.mjs"
      - ".github/workflows/embedded-pg17-runtime.yml"
  workflow_dispatch:

jobs:
  verify-native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies and native PostgreSQL binaries
        run: bun install --frozen-lockfile
      - name: Verify embedded PostgreSQL major version
        run: node --input-type=module -e "import { resolveBinaries } from './scripts/db/runtime.mjs'; console.log(resolveBinaries().postgres)"
      - name: Boot embedded PostgreSQL and run a real query
        shell: bash
        run: |
          timeout 180s node --input-type=module <<'NODE'
          import { start, ensureDatabase, stop, EMBEDDED_URL } from "./scripts/db/runtime.mjs";
          import pg from "pg";
          let client;
          try {
            await start();
            await ensureDatabase();
            client = new pg.Client({ connectionString: EMBEDDED_URL });
            await client.connect();
            const result = await client.query("SHOW server_version_num");
            const version = String(result.rows[0].server_version_num);
            if (!version.startsWith("17")) throw new Error(`Expected PostgreSQL 17, got ${version}`);
            await client.query("SELECT 1");
            console.log(`Embedded PostgreSQL ${version}: start, database creation and query passed`);
          } finally {
            if (client) await client.end().catch(() => {});
            await stop().catch(() => {});
          }
          NODE
      - name: Run unit tests and TypeScript checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun run test
          bun run typecheck
          bun run lint
