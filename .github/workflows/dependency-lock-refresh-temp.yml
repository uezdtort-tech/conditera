name: Temporary dependency lock refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-locks:
    if: ${{ !contains(github.event.head_commit.message, '[dep-lock-refresh-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Refresh npm and Bun lockfiles
        run: |
          npm install --package-lock-only --legacy-peer-deps
          bun install

      - name: Audit production dependencies (report only)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- package.json package-lock.json bun.lock; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json bun.lock
          git commit -m "chore(deps): refresh patched npm and Bun lockfiles [dep-lock-refresh-complete]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
