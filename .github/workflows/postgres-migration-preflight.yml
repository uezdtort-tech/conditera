name: PostgreSQL migration tooling

on:
  push:
    branches:
      - fix/postgres17-supabase-consolidation
    paths:
      - "scripts/ops/backup-dual-postgres-before-pg17.sh"
      - ".github/workflows/postgres-migration-preflight.yml"
  pull_request:
    paths:
      - "scripts/ops/backup-dual-postgres-before-pg17.sh"
      - ".github/workflows/postgres-migration-preflight.yml"
  workflow_dispatch:

jobs:
  validate-backup-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/ops/backup-dual-postgres-before-pg17.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/ops/backup-dual-postgres-before-pg17.sh
