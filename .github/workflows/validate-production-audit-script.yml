name: Validate single PostgreSQL 17 runtime audit script

on:
  pull_request:
    paths:
      - "scripts/ops/audit-local-production.ps1"
      - ".github/workflows/validate-production-audit-script.yml"
  push:
    branches:
      - feat/pg17-full-scenarios-current
    paths:
      - "scripts/ops/audit-local-production.ps1"
      - ".github/workflows/validate-production-audit-script.yml"

concurrency:
  group: validate-production-audit-script-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Parse PowerShell script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/ops/audit-local-production.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
          Write-Host "PowerShell syntax OK"

      - name: Test read-only audit against disposable Supabase PostgreSQL 17
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=conditera-supabase-runtime
          cleanup() {
            docker rm -fv "$RUNTIME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$RUNTIME" \
            -e POSTGRES_USER=supabase_admin \
            -e POSTGRES_PASSWORD=${{ 'ci-audit-password' }} \
            -e POSTGRES_DB=supabase \
            supabase/postgres:17.12.0.001

          READY=0
          for attempt in $(seq 1 60); do
            if docker exec "$RUNTIME" pg_isready -U supabase_admin -d supabase >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = 1

          # The Supabase image may briefly expose the initdb bootstrap postmaster.
          # Wait until the same final postmaster remains up across multiple probes.
          POSTMASTER_START=""
          STABLE_PROBES=0
          FINAL_READY=0
          for attempt in $(seq 1 30); do
            CURRENT_START="$(docker exec "$RUNTIME" psql -X -At -U supabase_admin -d supabase -c 'SELECT pg_postmaster_start_time()' 2>/dev/null || true)"
            if [ -n "$CURRENT_START" ] && [ "$CURRENT_START" = "$POSTMASTER_START" ]; then
              STABLE_PROBES=$((STABLE_PROBES + 1))
            else
              STABLE_PROBES=0
            fi
            POSTMASTER_START="$CURRENT_START"
            if [ "$STABLE_PROBES" -ge 2 ]; then
              FINAL_READY=1
              break
            fi
            sleep 2
          done
          test "$FINAL_READY" = 1

          docker exec -i "$RUNTIME" psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d supabase <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (id text PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS storage.objects (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.schema_migrations (version text PRIMARY KEY);
          INSERT INTO public.schema_migrations(version)
          SELECT 'audit-fixture-' || n FROM generate_series(1, 82) AS n
          ON CONFLICT DO NOTHING;
          CREATE TABLE IF NOT EXISTS public.profiles (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.user_roles (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.products (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.orders (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.inventory_items (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.chat_channels (id uuid PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS public.moderation_queue (id uuid PRIMARY KEY, author_name text, title text, content text, images text[] NOT NULL DEFAULT '{}', auto_score numeric NOT NULL DEFAULT 0, violations text[] NOT NULL DEFAULT '{}');
          ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS audit_read_only_fixture ON public.profiles;
          CREATE POLICY audit_read_only_fixture ON public.profiles USING (true);
          SELECT 'CREATE ROLE conditera_app LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'conditera_app') \gexec
          SELECT 'CREATE ROLE conditera_backup LOGIN BYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'conditera_backup') \gexec
          GRANT pg_read_all_data TO conditera_backup;
          SELECT 'CREATE ROLE anon LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') \gexec
          SELECT 'CREATE ROLE authenticated LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') \gexec
          SELECT 'CREATE ROLE service_role LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') \gexec
          SQL

          BEFORE="$(docker exec "$RUNTIME" psql -X -At -U supabase_admin -d supabase -c 'SELECT count(*) FROM public.schema_migrations')"
          pwsh -NoProfile -File scripts/ops/audit-local-production.ps1 \
            -RuntimeContainer "$RUNTIME" -Database supabase -User supabase_admin \
            -OutputRoot "$RUNNER_TEMP/conditera-audit-pg17"
          AFTER="$(docker exec "$RUNTIME" psql -X -At -U supabase_admin -d supabase -c 'SELECT count(*) FROM public.schema_migrations')"
          test "$BEFORE" = "$AFTER"
          test "$AFTER" = "82"

          REPORT="$(find "$RUNNER_TEMP/conditera-audit-pg17" -name pg17-runtime-inventory.json -type f | head -n 1)"
          test -n "$REPORT"
          jq -e '.mode == "READ_ONLY" and .databaseAudit.serverMajor == 17 and .databaseAudit.appMigrationCount == 82 and .safety.databasesModified == false and .safety.volumesModified == false' "$REPORT"
