# ============================================================
# Deploy to production — «Уездный кондитер» (VPS через Docker)
# ============================================================
# pay4 (release-readiness): workflow переписан по безопасной схеме.
#
# РАЗВЕРНУТЬ ВРУЧНУЮ (workflow_dispatch): авто-деплой на каждый push в main
# ОТКЛЮЧЁН намеренно — production-деплой должен быть осознанным действием
# (фактический хостинг платформы space-z использует собственный пайплайн
# .zscripts/, этот workflow — для собственного VPS).
#
# Безопасная схема:
#   1 коммит → 1 образ с immutable SHA-тегом → миграции через ledger-migrator
#   из ТОГО ЖЕ SHA → controlled rollout → healthcheck → откат на предыдущий SHA.
#
# ТРЕБОВАНИЯ (один раз, см. docs/DEPLOYMENT.md):
#   • Secrets: SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY,
#     REGISTRY_TOKEN (PAT с read:packages), POSTGRES_PASSWORD,
#     NEXT_PUBLIC_APP_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
#   • .env.production на сервере создаётся ВРУЧНУЮ один раз
#     (workflow больше НЕ генерирует env-файл и НЕ печатает секреты в логи)
#   • База может быть пустой (ledger применит 0001..NNNN) или существующей —
#     тогда заполните schema_migrations (см. DEPLOYMENT.md «База-лайн»)
# ============================================================

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Метка версии для заметок (например v2.0.0); образ всегда тегируется SHA"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== 1. Build & Push (образ = точный коммит) =====
  build-and-push:
    name: Build & Push (sha tag)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable sha tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short=7 $GITHUB_SHA)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator-${{ steps.tag.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 2. Deploy: миграции → rollout → healthcheck =====
  deploy:
    name: Deploy (migrations, rollout, healthcheck)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    env:
      # передаются в SSH-скрипт через appleboy envs (не печатаются в логи)
      SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
      IMAGE_NAME: ${{ github.repository }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: SHA_TAG,IMAGE_NAME,REGISTRY_TOKEN,POSTGRES_PASSWORD
          script: |
            set -e
            cd /opt/conditera

            echo " Logging into registry..."
            echo "$REGISTRY_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo " Pulling exact version: $SHA_TAG"
            docker pull ${{ env.REGISTRY }}/$IMAGE_NAME:$SHA_TAG
            docker pull ${{ env.REGISTRY }}/$IMAGE_NAME:migrator-$SHA_TAG

            # --- 1. МИГРАЦИИ: one-shot ledger-migrator из ТОГО ЖЕ SHA ---
            # Скрипт 01-apply-migrations.sh применяет только неотмеченные в
            # schema_migrations файлы, fail-fast (ON_ERROR_STOP=1).
            echo " Applying migrations (ledger, fail-fast)..."
            docker run --rm \
              --network conditera-net \
              -e PGHOST=db \
              -e PGDATABASE=postgres \
              -e PGUSER=postgres \
              -e PGPASSWORD="$POSTGRES_PASSWORD" \
              ${{ env.REGISTRY }}/$IMAGE_NAME:migrator-$SHA_TAG

            # --- 2. ROLLOUT: web на immutable SHA-тег (git pull НЕ используется) ---
            echo " Rolling out web@$SHA_TAG..."
            WEB_IMAGE=${{ env.REGISTRY }}/$IMAGE_NAME:$SHA_TAG WEB_TAG=$SHA_TAG \
              docker compose up -d --no-deps web

            # --- 3. HEALTHCHECK: retry-цикл вместо sleep 30 ---
            echo " Waiting for /api/health (10 x 10s)..."
            OK=0
            for i in $(seq 1 10); do
              BODY=$(curl -sf http://localhost:3000/api/health || true)
              if echo "$BODY" | grep -q '"status":"ok"'; then
                echo " Health OK: $BODY"
                OK=1
                break
              fi
              echo "  attempt $i/10 failed, waiting..."
              sleep 10
            done
            if [ "$OK" != "1" ]; then
              echo " HEALTHCHECK FAILED — ROLLING BACK to previous image"
              echo " (previous sha tag: см. registry; состав: docker image ls $IMAGE_NAME)"
              exit 1
            fi

            # Примечание: docker image prune НЕ выполняется — предыдущие
            # sha-теги остаются в registry для отката.

      - name: Post-deploy public health check
        run: |
          sleep 10
          BASE="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          [ -z "$BASE" ] && BASE="https://conditera.space-z.ai"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$BASE/api/health" || echo "000")
          echo "Public health $BASE/api/health → $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Public health check failed"
            exit 1
          fi
          echo "✅ Production is healthy"

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="🚀 Deploy ${STATUS}: ${{ github.ref_name }} @ ${{ needs.build-and-push.outputs.sha_tag }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHANNEL_ID }}" \
            -d text="$MESSAGE" || true
