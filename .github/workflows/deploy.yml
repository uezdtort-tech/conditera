# ============================================================
# Deploy to production — «Уездный кондитер»
# ============================================================
# Запускается вручную (workflow_dispatch) или при push в main.
# Pipeline: build → push to registry → SSH deploy → health-check
# ============================================================

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v2.0.0)"
        required: false
        default: "latest"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "supabase/**"
      - "docker-compose*.yml"
      - "Dockerfile*"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/deploy.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== 1. Build & Push Docker image =====
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{sha}},format=short
            type=raw,value=${{ inputs.version || 'latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

  # ===== 2. Deploy to server via SSH =====
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create .env.production on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            mkdir -p /opt/conditera
            cat > /opt/conditera/.env.production << 'ENV'
          ENV
          # Generate env file from secrets
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> /tmp/env-to-append
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> /tmp/env-to-append
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> /tmp/env-to-append
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> /tmp/env-to-append
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /tmp/env-to-append
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /tmp/env-to-append
          echo "YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }}" >> /tmp/env-to-append
          echo "YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}" >> /tmp/env-to-append
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> /tmp/env-to-append
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> /tmp/env-to-append
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> /tmp/env-to-append
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> /tmp/env-to-append
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> /tmp/env-to-append
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> /tmp/env-to-append
          echo "NODE_ENV=production" >> /tmp/env-to-append
          cat /tmp/env-to-append

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/conditera

            # Pull latest code
            git pull origin main

            # Login to registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Apply Supabase migrations
            docker-compose -f docker-compose.supabase.yml exec supabase-db psql -U supabase -d supabase -f /docker-entrypoint-initdb.d/0001_init.sql
            docker-compose -f docker-compose.supabase.yml exec supabase-db psql -U supabase -d supabase -f /docker-entrypoint-initdb.d/0002_marketplace.sql
            docker-compose -f docker-compose.supabase.yml exec supabase-db psql -U supabase -d supabase -f /docker-entrypoint-initdb.d/0003_search_function.sql
            docker-compose -f docker-compose.supabase.yml exec supabase-db psql -U supabase -d supabase -f /docker-entrypoint-initdb.d/0004_cake_builder_chat.sql
            docker-compose -f docker-compose.supabase.yml exec supabase-db psql -U supabase -d supabase -f /docker-entrypoint-initdb.d/0005_crm_cms.sql

            # Deploy Edge Functions
            # supabase functions deploy abandoned-cart --project-ref conditera
            # supabase functions deploy daily-digest --project-ref conditera
            # supabase functions deploy bonus-expiry --project-ref conditera
            # supabase functions deploy telegram-webhook --project-ref conditera
            # supabase functions deploy yookassa-webhook --project-ref conditera
            # supabase functions deploy send-notification --project-ref conditera

            # Restart services
            docker-compose -f docker-compose.supabase.yml up -d
            docker-compose up -d --no-deps web

            # Wait for health check
            sleep 30

            # Health check
            curl -sf http://localhost:3000/api/health || exit 1
            curl -sf http://localhost:8000/ || exit 1

            # Cleanup old images
            docker image prune -f

            echo "✅ Deploy successful!"
            echo "  Web: https://conditera.ru"
            echo "  Studio: http://localhost:8100"
            echo "  Health: https://conditera.ru/api/health"

  # ===== 3. Post-deploy health check =====
  health-check:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for services to start
        run: sleep 30

      - name: Check production health
        run: |
          echo "Checking https://conditera.ru/api/health..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://conditera.ru/api/health || echo "000")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed!"
            exit 1
          fi
          echo "✅ Production is healthy!"

      - name: Notify Telegram channel
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="🚀 Deploy ${STATUS}: ${{ github.ref_name }} @ ${{ github.sha }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHANNEL_ID }}" \
            -d text="$MESSAGE" || true
