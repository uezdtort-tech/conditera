name: PostgreSQL 17 migration compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/compat/**"
      - "scripts/db/**"
      - ".github/workflows/postgres-17-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/compat/**"
      - "scripts/db/**"
      - ".github/workflows/postgres-17-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Apply all Conditera migrations on Supabase PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply and verify all SQL migrations on PostgreSQL 17
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
        run: node scripts/db/verify-pg17.mjs
