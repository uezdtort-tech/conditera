name: Refresh dependency lock for patched Next.js

on:
  push:
    branches: [fix/main-release-gates-20261124]
    paths:
      - "package.json"
      - ".github/workflows/refresh-dependency-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-release-gates-20261124
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve and write the exact Bun lockfile
        run: bun install --lockfile-only
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh bun lockfile for patched Next.js"
          git push
