# ============================================================
# CI/CD для «Уездный кондитер» (v2.0 — Supabase, bun)
# ============================================================
# Запускается на каждый push в main и на каждый PR.
# Pipeline: lint → typecheck → test → build → docker-build → security.
# Все шаги — строгие (БЕЗ continue-on-error, кроме coverage). Любая ошибка ломает CI.
#
# v2.0 изменения:
#   • Prisma УДАЛЕНА из проекта — шаги `npx prisma generate` убраны
#   • Пакетный менеджер — bun (bun.lock — источник истины, package-lock.json удалён)
#   • Playwright E2E вынесен в отдельный workflow e2e.yml (nightly + ручной запуск)
#   • Job smoke-test-db убран: скрипт использовал Prisma-API, несовместимый с v2.0
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ===== 1. Lint + Type-check =====
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck
        # СТРОГО: любая TS-ошибка ломает CI. Никаких continue-on-error.

      - name: Lint
        run: bun run lint
        # СТРОГО: eslint ошибки ломают CI.

  # ===== 2. Unit tests (Vitest) =====
  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          # vitest.setup.ts сам выставляет NEXT_PUBLIC_SUPABASE_URL/ANON_KEY заглушки

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
        continue-on-error: true  # coverage не должен ломать CI, но отчёт нужен

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ===== 3. Build =====
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          CRON_SECRET: "ci_test_cron_secret"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_NAME: "Уездный кондитер"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"
          DATABASE_URL: "file:./db/ci-test.db"
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # ===== 4. Docker build =====
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: conditera:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.chat
          push: false
          tags: conditera-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simplex-bridge image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.simplex-bridge
          push: false
          tags: conditera-simplex-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 5. Security checks =====
  # npm audit убран: в репозитории bun.lock (npm audit требует package-lock).
  # Сканирование секретов работает без установки зависимостей.
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # Проверка на закоммиченные секреты
          if grep -rEn "(sk_live_|pk_live_|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|glpat-)" \
            --include="*.ts" --include="*.tsx" --include="*.json" \
            --exclude-dir=node_modules src/ scripts/ mini-services/ 2>/dev/null; then
            echo "❌ Found potential secrets in code"
            exit 1
          fi
          echo "✓ No secrets found in code"

      - name: Check for .env files in repo
        run: |
          # Проверка что нет закоммиченных .env файлов с секретами
          FOUND=$(find . -maxdepth 2 -name ".env*" -not -path "./node_modules/*" -not -path "./.git/*" \
            -not -name "*.example" -not -name "*.template" | head -5)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Found .env files in repository (review them):"
            echo "$FOUND"
          fi
          echo "✓ Secret files check complete"

  # ===== 6. Validate Caddyfile =====
  validate-caddyfile:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Caddyfile syntax
        run: |
          if [ ! -f Caddyfile ]; then
            echo "Caddyfile not found, skipping"
            exit 0
          fi
          # Используем caddy image для валидации
          docker run --rm -v $(pwd)/Caddyfile:/etc/caddy/Caddyfile caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
