# ============================================================
# CI/CD для «Уездный кондитер» (v2.0 — Supabase, bun)
# ============================================================
# Запускается на каждый push в main и на каждый PR.
# Pipeline: lint → typecheck → test → build → docker-build → security.
# Все шаги — строгие (БЕЗ continue-on-error, кроме coverage). Любая ошибка ломает CI.
#
# v4.5 (решение владельца 2026-10-17, RELEASE-GATE-v4.5):
#   • docker-build больше НЕ ограничен push в main — выполняется и на PR:
#     Docker-гейт кандидата (3 образа + Compose validation + secret-gate)
#     обязан пройти на точном SHA ДО merge (локального Docker Engine в
#     sandbox нет — CI равноценная среда выполнения)
#   • в docker-build добавлены: docker compose config (валидация конфигурации,
#     НЕ заменяется сборкой образов) и secret-gate по слоям (docker history)
#   • новый job evidence-hygiene: hygiene-сканер секретов (real=заглушки →
#     exit 1) + его adversarial-регрессия + контракт .env.production.example
#     — подключается владельцем к required checks для PR
#
# v2.0 изменения:
#   • Prisma УДАЛЕНА из проекта — шаги `npx prisma generate` убраны
#   • Пакетный менеджер — bun (bun.lock — источник истины, package-lock.json удалён)
#   • Playwright E2E вынесен в отдельный workflow e2e.yml (nightly + ручной запуск)
#   • Job smoke-test-db убран: скрипт использовал Prisma-API, несовместимый с v2.0
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  # ===== 1. Lint + Type-check =====
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck
        # СТРОГО: любая TS-ошибка ломает CI. Никаких continue-on-error.

      - name: Lint
        run: bun run lint
        # СТРОГО: eslint ошибки ломают CI.

  # ===== 2. Unit tests (Vitest) =====
  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          # vitest.setup.ts сам выставляет NEXT_PUBLIC_SUPABASE_URL/ANON_KEY заглушки

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
        continue-on-error: true  # coverage не должен ломать CI, но отчёт нужен

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ===== 3. Build =====
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          CRON_SECRET: "ci_test_cron_secret"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_NAME: "Уездный кондитер"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"
          DATABASE_URL: "file:./db/ci-test.db"
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # ===== 4. Docker: compose validation + 3 образа + secret-gate =====
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      # v4.6 (P0): образы собираются на АКТУАЛЬНОМ SHA кандидата.
      # На pull_request github.sha = merge-коммит PR, а не head ветки —
      # теги/GIT_SHA обязаны использовать SHA головы PR, иначе «сборка
      # на актуальном SHA» не выполняется по построению. Для push — github.sha.
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        # v4.6 (P0): чекаутим ИМЕННО тот SHA, которым тегируются образы.
        # На pull_request дефолтный checkout = merge-коммит, а тег был бы head
        # PR — «тег одного SHA, собран другой исходник». Здесь исключено:
        # исходник = CANDIDATE_SHA (для push совпадает с github.sha).
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify checked-out source SHA == image tag SHA
        # Доказательство в логе CI: собранный исходник == тег образов.
        # v4.7: в лог фиксируются ОБА SHA — фактический checked-out (git
        # rev-parse HEAD) и github.sha (на pull_request это merge-коммит,
        # НЕ исходник образов; на push совпадает с CANDIDATE_SHA).
        run: |
          CHECKED="$(git rev-parse HEAD)"
          TAGGED="${{ env.CANDIDATE_SHA }}"
          echo "github.sha (merge-SHA on PR, NOT image source): ${{ github.sha }}"
          echo "checked-out SHA: $CHECKED"
          echo "tag SHA:         $TAGGED"
          if [ "$CHECKED" != "$TAGGED" ]; then
            echo "❌ MISMATCH: images would be tagged with a SHA they were not built from"
            exit 1
          fi
          echo "✓ source tree is exactly the tagged candidate SHA"

      - name: Validate Compose configuration
        # v4.5 (P0-B): сборка образов НЕ заменяет валидацию конфигурации.
        # Обязательные переменные подставлены dummy-значениями — проверяется
        # структура/интерполяция compose-файла, не значения секретов.
        run: |
          touch .env.production
          trap 'rm -f .env.production' EXIT
          POSTGRES_PASSWORD=ci-dummy \
          MEILI_MASTER_KEY=ci-dummy \
          JWT_SECRET=ci-dummy-jwt-secret-32-chars-aaaaaaaa \
          JWT_REFRESH_SECRET=ci-dummy-jwt-refresh-secret-32-chars-a \
          CRON_SECRET=ci-dummy \
          SIMPLEX_BRIDGE_API_KEY=ci-dummy \
          N8N_ADMIN_PASSWORD=ci-dummy \
          NEXT_PUBLIC_SUPABASE_URL=https://conditera-ci.invalid/api \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=stub_ci_anon_key_not_for_deploy \
          NEXT_PUBLIC_APP_URL=https://conditera-ci.invalid \
          docker compose -f docker-compose.yml config -q
          echo "✓ docker-compose.yml is valid"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: conditera:${{ env.CANDIDATE_SHA }}
          # DEV-15: GIT_SHA → ENV APP_VERSION в образе (Dockerfile:43-44/72-73) —
          # версия деплоя видна в /api/health (version). Без этого APP_VERSION=unknown.
          build-args: |
            GIT_SHA=${{ env.CANDIDATE_SHA }}
            CI=true
            NEXT_PUBLIC_SUPABASE_URL=https://conditera-ci.invalid/api
            NEXT_PUBLIC_SUPABASE_ANON_KEY=stub_ci_anon_key_not_for_deploy
            NEXT_PUBLIC_APP_URL=https://conditera-ci.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.chat
          push: false
          load: true
          tags: conditera-chat:${{ env.CANDIDATE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simplex-bridge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.simplex-bridge
          push: false
          load: true
          tags: conditera-simplex-bridge:${{ env.CANDIDATE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image existence + layer-history + exported-fs secret-gate
        # v4.5 (P0-B): docker history показывает команды сборки слоёв.
        # v4.6 (P0):
        #   1) существование КАЖДОГО образа доказывается docker image inspect
        #      ДО сканирования — тег сам по себе НЕ доказательство (load:true
        #      обязан положить образ в daemon, иначе гейт падает здесь);
        #   2) history/inspect — НЕ полное сканирование секретов: они не видят
        #      содержимое файлов. Добавлен контент-скан экспортированной
        #      ФАЙЛОВОЙ СИСТЕМЫ образа (docker create + docker export | grep),
        #      те же паттерны, что и в history-скане.
        run: |
          FAIL=0
          SECRET_RE='(sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|glpat-[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY|ci_test_jwt_secret|ci_test_tfa_key)'
          for img in "conditera:${{ env.CANDIDATE_SHA }}" "conditera-chat:${{ env.CANDIDATE_SHA }}" "conditera-simplex-bridge:${{ env.CANDIDATE_SHA }}"; do
            echo "— $img"
            # 1) существование — строго до history/скана
            if ! docker image inspect "$img" > /dev/null 2>&1; then
              echo "❌ image NOT present in local daemon: $img"
              FAIL=1
              continue
            fi
            echo "  ✓ inspect ok (image exists)"
            # 2) секреты в командах сборки слоёв
            if docker history --no-trunc "$img" 2>/dev/null | grep -Eiq "$SECRET_RE"; then
              echo "❌ potential secret in layer history of $img"
              FAIL=1
            else
              echo "  ✓ layer history clean"
            fi
            # 3) секреты в содержимом файлов образа (экспорт файловой системы)
            CID="sg-$(echo "$img" | tr ':/' '--')"
            docker create --name "$CID" "$img" > /dev/null
            if docker export "$CID" | grep -aEiq "$SECRET_RE"; then
              echo "❌ potential secret in exported filesystem of $img"
              FAIL=1
            else
              echo "  ✓ exported filesystem content clean"
            fi
            docker rm -f "$CID" > /dev/null
          done
          exit $FAIL

      - name: Smoke-test SimpleX CLI and bridge runtime
        # theirs (origin/main): runtime-смоук CLI + bridge (валидированные
        # фиксы SimpleX). Тег — тот же CANDIDATE_SHA, что и у сборки выше.
        env:
          IMAGE: conditera-simplex-bridge:${{ env.CANDIDATE_SHA }}
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint simplex-chat "$IMAGE" --help >/tmp/simplex-help.txt
          grep -qi "simplex" /tmp/simplex-help.txt

          docker run -d --name conditera-simplex-bridge-ci \
            -e NODE_ENV=test \
            -e SIMPLEX_CLI_PORT=5225 \
            -e SIMPLEX_PROFILE_NAME=Conditera-CI \
            -e BRIDGE_PORT=5226 \
            -p 5226:5226 "$IMAGE"
          cleanup() {
            docker logs conditera-simplex-bridge-ci || true
            docker rm -f conditera-simplex-bridge-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:5226/health >/tmp/simplex-health.json; then
              if grep -q '"cliConnected":true' /tmp/simplex-health.json \
                && grep -q '"isInitialized":true' /tmp/simplex-health.json \
                && grep -Eq '"activeProfile":"[0-9]+"' /tmp/simplex-health.json; then
                READY=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "SimpleX CLI profile was not initialized within 60 seconds."
            cat /tmp/simplex-health.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/simplex-health.json
          echo "SimpleX CLI and bridge initialized successfully."

  # ===== 5. Security checks =====
  # npm audit убран: в репозитории bun.lock (npm audit требует package-lock).
  # Сканирование секретов работает без установки зависимостей.
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Kong 2.8 Compose contract
        run: |
          node scripts/verify/kong-compose-contract.mjs
          docker run --rm \
            -v "$PWD/supabase/kong.yml:/kong.yml:ro" \
            -e KONG_DATABASE=off \
            -e KONG_PLUGINS=request-transformer,cors,key-auth,acl,basic-auth,rate-limiting \
            -e KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k \
            -e 'KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k' \
            -e KONG_NGINX_PROXY_PROXY_BUSY_BUFFERS_SIZE=320k \
            library/kong:2.8.1 kong config parse /kong.yml

      - name: Validate database bootstrap and preflight scripts
        run: |
          bash -n supabase/init-scripts/01-apply-migrations.sh
          bash -n scripts/deploy.sh
          bash -n scripts/db-preflight.sh
          grep -Fq 'MIGRATIONS_DIR: /conditera-migrations' docker-compose.supabase.yml
          grep -Fq 'zz-conditera-apply-migrations.sh' docker-compose.supabase.yml
          grep -Fq ':/conditera-migrations:ro' docker-compose.supabase.yml
          grep -Fq 'SEEDS_DIR: /docker-entrypoint-initdb.d/seed' docker-compose.supabase.yml
          grep -Fq 'SEED_MODE: none' docker-compose.supabase.yml
          grep -Fq 'SEED_MODE="${SEED_MODE:-none}"' supabase/init-scripts/01-apply-migrations.sh
          grep -Fq 'PGHOST=db' docker-compose.yml
          grep -Fq 'PGDATABASE=conditera' docker-compose.yml
          echo "Database bootstrap configuration checks passed"

      - name: Setup Node for full tracked-files secret scan
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Check for secrets in code (full tracked scan with explicit fixture rules)
        run: node scripts/regression/secrets-scan.mjs --mode=full
      - name: Check for .env files in repo
        run: |
          # Проверка что нет закоммиченных .env файлов с секретами
          FOUND=$(find . -maxdepth 2 -name ".env*" -not -path "./node_modules/*" -not -path "./.git/*" \
            -not -name "*.example" -not -name "*.template" | head -5)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Found .env files in repository (review them):"
            echo "$FOUND"
          fi
          echo "✓ Secret files check complete"

      - name: Red-line drift guard (mandatory upload paths)
        # v4.8: структурная проверка красной зоны. За историю релиза 4 раза
        # фиксировался один класс drift (#8/#10/#11/#12): удаление upload-
        # маршрутов и их тестов из рабочего дерева. CI падает, если любой
        # обязательный путь удалён с диска или перестал отслеживаться Git.
        # Второй слой защиты — unit-регрессия src/lib/redline-paths.test.ts.
        run: |
          FAIL=0
          for p in \
            src/app/api/upload/route.ts \
            src/app/api/upload/route.test.ts \
            src/app/api/services/upload/route.ts \
            src/app/api/services/upload/route.test.ts; do
            if [ ! -f "$p" ]; then
              echo "❌ mandatory path DELETED from disk: $p"
              FAIL=1
            fi
            if ! git ls-files --error-unmatch "$p" > /dev/null 2>&1; then
              echo "❌ mandatory path NOT tracked by git: $p"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then
            echo "Red-line drift detected — restore only the specific paths (no reset/clean)."
          else
            echo "✓ all 4 mandatory upload paths present and tracked"
          fi
          exit $FAIL

  # ===== 6. Validate Caddyfile =====
  validate-caddyfile:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Caddyfile syntax
        run: |
          if [ ! -f Caddyfile ]; then
            echo "Caddyfile not found, skipping"
            exit 0
          fi
          # Используем caddy image для валидации (public.ecr.aws — зеркало без
          # rate-limit 429 Docker Hub, см. v3 registry-hardening в Dockerfile)
          docker run --rm -v $(pwd)/Caddyfile:/etc/caddy/Caddyfile \
            caddy:2.11.9-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # ===== 7. Evidence hygiene (v4.5, P0-A) =====
  # Обязательный PR-гейт: hygiene-сканер секретов по tracked evidence
  # (real-находка → exit 1), его adversarial-регрессия (14 кейсов: =-свободные
  # секреты не пропускаются, легитимные понижения работают) и контракт
  # обязательных переменных .env.production.example. Все три скрипта —
  # только node builtins, установка зависимостей не нужна.
  evidence-hygiene:
    name: Evidence hygiene (secret scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan tracked evidence for real secrets/PII
        run: node scripts/scan-evidence.mjs

      - name: Scanner downgrade-rule adversarial regression
        run: node scripts/verify/scan-evidence-rules-verify.mjs

      - name: Production env template contract
        run: node scripts/verify/production-env-template.mjs

      - name: Route error-capture coverage (DEPLOY-01 §3)
        # Гвард единой регистрации ошибок: каждый маршрут критичного
        # бизнес-периметра обязан писать 5xx в app_error_events
        # (handleRouteError/captureServerError). Новый непокрытый
        # core-маршрут = FAIL (иначе инцидент не создастся).
        run: node scripts/verify/route-error-coverage.mjs

  # ===== 8. Миграции на чистой PostgreSQL 17 — ЦЕЛЕВАЯ конфигурация =====
  # Сведение версий (2026-11-22): единый Supabase Runtime = PG17, сценарный CI
  # = PG17, embedded db:setup = PG17 (см. scripts/verify/pg-version-gate.mjs).
  # Реальный ledger-мигратор прод-пайплайна (supabase/init-scripts/
  # 01-apply-migrations.sh) против чистой PG17: прогон + идемпотентный
  # повторный прогон + проверка RLS-политик/GRANT критичных таблиц.
  migrations-pg17:
    name: Migrations on clean PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase image includes the extensions/auth schemas required by project migrations.
        image: supabase/postgres:17.11.0.017
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: PG version gate — все пути запуска/проверки БД на PG17
        run: node scripts/verify/pg-version-gate.mjs
        timeout-minutes: 2

      - name: Copy migrations + migrator into service container
        run: |
          SVC="${{ job.services.postgres.id }}"
          docker exec "$SVC" mkdir -p /migrations /init-scripts
          docker cp supabase/migrations/. "$SVC":/migrations/
          docker cp supabase/init-scripts/01-apply-migrations.sh "$SVC":/init-scripts/

      - name: Bootstrap minimal Supabase Storage schema for migration contract
        # The full runtime creates these objects through Storage API.
        # This isolated migration job creates only the contract needed by migration 0026.
        run: |
          SVC="${{ job.services.postgres.id }}"
          docker exec -i "$SVC" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean NOT NULL DEFAULT false,
            allowed_mime_types text[],
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text NOT NULL REFERENCES storage.buckets(id),
            name text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION storage.foldername(name text)
          RETURNS text[]
          LANGUAGE sql IMMUTABLE
          AS $$
            SELECT CASE
              WHEN position('/' in name) = 0 THEN ARRAY[]::text[]
              ELSE string_to_array(trim(both '/' from regexp_replace(name, '/[^/]*$', '')), '/')
            END;
          $$;
          SQL

      - name: Apply all migrations (ledger, fail-fast)
        run: |
          SVC="${{ job.services.postgres.id }}"
          docker exec "$SVC" env PGUSER=supabase_admin PGDATABASE=postgres bash /init-scripts/01-apply-migrations.sh
          docker exec "$SVC" psql -U supabase_admin -d postgres -tAc \
            "SELECT count(*) FROM public.schema_migrations" > applied.txt
          APPLIED=$(cat applied.txt)
          TOTAL=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          echo "applied=$APPLIED total=$TOTAL"
          test "$APPLIED" -eq "$TOTAL" || { echo "FAIL: применены не все миграции"; exit 1; }

      - name: Idempotency — повторный прогон (все файлы должны быть пропущены)
        run: |
          SVC="${{ job.services.postgres.id }}"
          docker exec "$SVC" env PGUSER=supabase_admin PGDATABASE=postgres bash /init-scripts/01-apply-migrations.sh \
            | tee rerun.log
          if grep -q "Применяю:" rerun.log; then
            echo "FAIL: повторный прогон пытался применять миграции повторно"; exit 1
          fi
          echo "OK: rerun no-op"

      - name: RLS/GRANT sanity — политики и привилегии критичных таблиц
        run: |
          SVC="${{ job.services.postgres.id }}"
          docker exec -i "$SVC" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            missing text := '';
            t text;
          BEGIN
            FOR t IN SELECT unnest(ARRAY[
              'app_error_events','app_incidents','app_incident_history',
              'ops_tasks','orders','payments','recipe_purchases','inventory_items'
            ])
            LOOP
              IF NOT EXISTS (
                SELECT 1 FROM pg_tables WHERE tablename = t AND schemaname = 'public' AND rowsecurity
              ) THEN
                missing := missing || t || ' ';
              END IF;
            END LOOP;
            IF missing <> '' THEN
              RAISE EXCEPTION 'FAIL: RLS не включён для: %', missing;
            END IF;
          END $$;
          SELECT 'RLS CHECK OK' AS status;
          SQL

      - name: Write-path closures — прямые записи клиентских ролей запрещены (0077)
        run: |
          SVC="${{ job.services.postgres.id }}"
          docker exec -i "$SVC" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            t text;
            has_write boolean;
            offenders text := '';
          BEGIN
            FOR t IN SELECT unnest(ARRAY[
              'inventory_items','stock_movements','recipe_purchases',
              'recipes','recipe_marketplace','financial_ledger'
            ])
            LOOP
              SELECT count(*) > 0 INTO has_write
                FROM information_schema.role_table_grants
               WHERE table_schema='public' AND table_name = t
                 AND grantee IN ('anon','authenticated')
                 AND privilege_type IN ('INSERT','UPDATE','DELETE');
              IF has_write THEN offenders := offenders || t || ' '; END IF;
            END LOOP;
            IF offenders <> '' THEN
              RAISE EXCEPTION 'FAIL: write-grants для клиентских ролей у: %', offenders;
            END IF;
          END $$;
          SELECT 'WRITE-PATH CHECK OK' AS status;
          SQL


  backup-restore-pg18:
    name: Full backup and restore verification on PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: conditera
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: conditera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conditera -d conditera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      restore:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: conditera
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U conditera -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Seed representative application schema and rows
        env:
          SOURCE_CONTAINER_ID: ${{ job.services.source.id }}
        run: |
          set -euo pipefail
          docker exec -i "$SOURCE_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U conditera -d conditera <<'SQL'
          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY,
            display_name text NOT NULL
          );
          CREATE TABLE public.orders (
            id uuid PRIMARY KEY,
            user_id uuid NOT NULL REFERENCES public.profiles(id),
            total_kopecks bigint NOT NULL
          );
          CREATE TABLE public.inventory_items (
            id uuid PRIMARY KEY,
            quantity numeric NOT NULL
          );
          CREATE VIEW public.order_summary AS
            SELECT user_id, count(*)::int AS order_count, sum(total_kopecks)::bigint AS total_kopecks
            FROM public.orders GROUP BY user_id;
          INSERT INTO public.profiles VALUES
            ('00000000-0000-4000-8000-000000000001', 'Backup Test User');
          INSERT INTO public.orders VALUES
            ('00000000-0000-4000-8000-000000000011', '00000000-0000-4000-8000-000000000001', 12500),
            ('00000000-0000-4000-8000-000000000012', '00000000-0000-4000-8000-000000000001', 25000);
          INSERT INTO public.inventory_items VALUES
            ('00000000-0000-4000-8000-000000000021', 250.5);
          SQL
      - name: Verify full pg_dump and real restore into separate PostgreSQL 18 cluster
        env:
          NODE_ENV: production
          BACKUP_REQUIRE_FULL_RESTORE: "true"
          BACKUP_DIR: ${{ runner.temp }}/conditera-backup-verify
          DATABASE_URL: postgresql://conditera:ci-only-password@127.0.0.1:5432/conditera
          DIRECT_DATABASE_URL: postgresql://conditera:ci-only-password@127.0.0.1:5432/conditera
          BACKUP_RESTORE_DATABASE_URL: postgresql://conditera:ci-only-password@127.0.0.1:5433/postgres
          BACKUP_RESTORE_PSQL_URL: postgresql://conditera:ci-only-password@127.0.0.1:5432/conditera_restore_verify
          BACKUP_RESTORE_DB_NAME: conditera_restore_verify
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgtools" "$BACKUP_DIR"
          cat > "$RUNNER_TEMP/pgtools/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i "$SOURCE_CONTAINER_ID" pg_dump "$@"
          SH
          cat > "$RUNNER_TEMP/pgtools/psql" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i -e "PGPASSWORD=${PGPASSWORD:-}" "$RESTORE_CONTAINER_ID" psql "$@"
          SH
          chmod +x "$RUNNER_TEMP/pgtools/pg_dump" "$RUNNER_TEMP/pgtools/psql"
          export SOURCE_CONTAINER_ID="${{ job.services.source.id }}"
          export RESTORE_CONTAINER_ID="${{ job.services.restore.id }}"
          export PATH="$RUNNER_TEMP/pgtools:$PATH"
          bun run ops:restore-verify


  backup-supabase-pg15-to-pg17:
    name: Supabase PG15 logical backup and PG17 restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      source:
        image: supabase/postgres:15.6.1.141
        env:
          POSTGRES_USER: supabase
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase -d supabase"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Seed representative Supabase source data
        env:
          SOURCE_CONTAINER_ID: ${{ job.services.source.id }}
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=ci-only-password "$SOURCE_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U supabase -d supabase <<'SQL'
          CREATE TABLE public.backup_probe (
            id integer PRIMARY KEY,
            marker text NOT NULL
          );
          INSERT INTO public.backup_probe VALUES (1, 'PG15_TO_PG17_RESTORE_OK');
          SQL
      - name: Create full Supabase PG15 logical backup
        env:
          SUPABASE_DB_CONTAINER: ${{ job.services.source.id }}
          SUPABASE_DB_NAME: supabase
          SUPABASE_DB_USER: supabase
          SUPABASE_BACKUP_DIR: ${{ runner.temp }}/supabase-pg15-backup
        run: |
          set -euo pipefail
          bash scripts/ops/backup-supabase-db.sh
          find "$SUPABASE_BACKUP_DIR" -maxdepth 1 -type f -name '*.sql.gz' -print -quit | grep -q .
      - name: Restore Supabase dump into isolated PG17 database
        env:
          BACKUP_DIR: ${{ runner.temp }}/supabase-pg15-backup
        run: |
          set -euo pipefail
          RESTORE_CONTAINER="conditera-supabase-pg17-restore-${{ github.run_id }}"
          trap 'docker rm -f "$RESTORE_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$RESTORE_CONTAINER" -p 5433:5432 \
            -e POSTGRES_USER=supabase \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=postgres \
            supabase/postgres:17.11.0.017 \
            postgres -c config_file=/etc/postgresql/postgresql.conf \
              -c cron.database_name=supabase_restore \
              -c cron.username=supabase
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$RESTORE_CONTAINER" pg_isready -U supabase -d postgres; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec -e PGPASSWORD=ci-only-password "$RESTORE_CONTAINER" psql -v ON_ERROR_STOP=1 -U supabase -d postgres -c 'CREATE DATABASE supabase_restore TEMPLATE template0'
          DUMP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.sql.gz' -print -quit)"
          test -n "$DUMP_FILE"
          gzip -t "$DUMP_FILE"
          gzip -dc "$DUMP_FILE" | docker exec -i -e PGPASSWORD=ci-only-password "$RESTORE_CONTAINER" psql -v ON_ERROR_STOP=1 -U supabase -d supabase_restore
          RESULT="$(docker exec -e PGPASSWORD=ci-only-password "$RESTORE_CONTAINER" psql -U supabase -d supabase_restore -Atqc "SELECT marker FROM public.backup_probe WHERE id=1")"
          test "$RESULT" = "PG15_TO_PG17_RESTORE_OK"
          echo "SUPABASE PG15 -> PG17 LOGICAL RESTORE: PASSED"

  # ===== 9. Безопасность зависимостей (DEPLOY-01 §6 п.17) =====
  # osv-scanner по bun.lock с baseline-диффом: НОВЫЕ advisory → FAIL,
  # известные (baseline) → WARN + remediation backlog (OWNER_DECISIONS D-8).
  deps-audit:
    name: Dependency security audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download osv-scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan bun.lock with baseline diff (new advisories fail)
        run: node scripts/verify/osv-audit.mjs
