# ============================================================
# CI/CD для «Уездный кондитер» (v2.0 — Supabase, bun)
# ============================================================
# Запускается на каждый push в main и на каждый PR.
# Pipeline: lint → typecheck → test → build → docker-build → security.
# Все шаги — строгие (БЕЗ continue-on-error, кроме coverage). Любая ошибка ломает CI.
#
# v2.0 изменения:
#   • Prisma УДАЛЕНА из проекта — шаги `npx prisma generate` убраны
#   • Пакетный менеджер — bun (bun.lock — источник истины, package-lock.json удалён)
#   • Playwright E2E вынесен в отдельный workflow e2e.yml (nightly + ручной запуск)
#   • Job smoke-test-db убран: скрипт использовал Prisma-API, несовместимый с v2.0
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ===== 1. Lint + Type-check =====
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck
        # СТРОГО: любая TS-ошибка ломает CI. Никаких continue-on-error.

      - name: Lint
        run: bun run lint
        # СТРОГО: eslint ошибки ломают CI.

  # ===== 2. Unit tests (Vitest) =====
  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          # vitest.setup.ts сам выставляет NEXT_PUBLIC_SUPABASE_URL/ANON_KEY заглушки

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
        continue-on-error: true  # coverage не должен ломать CI, но отчёт нужен

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ===== PostgreSQL 17 compatibility =====
  postgres-17-compatibility:
    name: PostgreSQL 17 — full SQL migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conditera
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conditera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres15:
        image: supabase/postgres:15.6.1.141
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supabase
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d supabase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres17_app:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conditera
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d conditera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply and verify every SQL migration on Supabase PostgreSQL 17
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
        run: node scripts/db/verify-pg17.mjs

      - name: Prepare PostgreSQL 18 Conditera source
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/conditera
          EXPECTED_POSTGRES_MAJOR: "18"
          SKIP_UNAVAILABLE_EXTENSIONS: "1"
        run: |
          node scripts/db/verify-pg17.mjs
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/conditera node scripts/db/setup.mjs --seed-only

      - name: Prepare official Supabase PG15 source and PG17 single-database target
        shell: bash
        run: |
          set -euo pipefail
          SOURCE15_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "supabase/postgres:15.6.1.141" { print $1; exit }')"
          SOURCE18_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:18-alpine" { print $1; exit }')"
          TARGET_ID="$(docker ps --filter publish=5435 --format '{{.ID}}' | head -1)"
          test -n "$SOURCE15_ID"
          test -n "$SOURCE18_ID"
          test -n "$TARGET_ID"

          # Apply the same service-role password init mounted by production Compose.
          for DB_ID in "$SOURCE15_ID" "$TARGET_ID"; do
            docker cp supabase/init-scripts/99-supabase-roles.sql "$DB_ID:/tmp/99-supabase-roles.sql"
            DB_NAME="supabase"
            if [ "$DB_ID" = "$TARGET_ID" ]; then DB_NAME="conditera"; fi
            docker exec -e POSTGRES_PASSWORD=postgres -e PGPASSWORD=postgres "$DB_ID" psql -U supabase_admin -d "$DB_NAME" -v ON_ERROR_STOP=1 -f /tmp/99-supabase-roles.sql
            PASSWORD_ROLES="$(docker exec -e PGPASSWORD=postgres "$DB_ID" psql -U supabase_admin -d "$DB_NAME" -Atqc "SELECT count(*) FROM pg_authid WHERE rolname = ANY (ARRAY['authenticator','pgbouncer','supabase_auth_admin','supabase_storage_admin']) AND rolpassword IS NOT NULL")"
            test "$PASSWORD_ROLES" = "4"
            OPTIONAL_FUNCTIONS_ROLE="$(docker exec -e PGPASSWORD=postgres "$DB_ID" psql -U supabase_admin -d "$DB_NAME" -Atqc "SELECT count(*) FROM pg_authid WHERE rolname='supabase_functions_admin' AND rolpassword IS NOT NULL")"
            if [ "$OPTIONAL_FUNCTIONS_ROLE" -gt 0 ]; then
              test "$OPTIONAL_FUNCTIONS_ROLE" = "1"
            fi
          done

          # Exercise production bootstrap before Storage API creates its schema.
          docker cp supabase/init-scripts/90-create-conditera-db.sql "$TARGET_ID:/tmp/90-create-conditera-db.sql"
          docker exec -e PGPASSWORD=postgres -e CONDITERA_DB_PASSWORD=ci_conditera_password_32_chars "$TARGET_ID" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -f /tmp/90-create-conditera-db.sql
          APP_ROLE="$(docker exec -e PGPASSWORD=postgres "$TARGET_ID" psql -U supabase_admin -d conditera -Atqc "SELECT rolsuper::text || ':' || rolbypassrls::text FROM pg_roles WHERE rolname='conditera'")"
          test "$APP_ROLE" = "false:true"

          # Build the same Storage schema as the pinned storage-api image,
          # while reusing the Supabase roles created by the official Postgres image.
          curl -fsSL https://raw.githubusercontent.com/supabase/storage/v1.14.5/migrations/tenant/0002-storage-schema.sql -o "$RUNNER_TEMP/storage-v1.14.5-0002.sql"
          {
            printf "SET storage.install_roles = 'false';\n"
            cat "$RUNNER_TEMP/storage-v1.14.5-0002.sql"
          } > "$RUNNER_TEMP/storage-schema.sql"

          docker exec -e PGPASSWORD=postgres -i "$SOURCE15_ID" psql -U supabase_admin -d supabase -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/storage-schema.sql"
          docker exec -e PGPASSWORD=postgres -i "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/storage-schema.sql"

          # Storage tables are created by the Storage API migration. Hand ownership
          # to its service role for this isolated compatibility test.
          for DB_ID in "$SOURCE15_ID" "$TARGET_ID"; do
            DB_NAME="supabase"
            if [ "$DB_ID" = "$TARGET_ID" ]; then DB_NAME="conditera"; fi
            docker exec -e PGPASSWORD=postgres "$DB_ID" psql -U supabase_admin -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "ALTER TABLE storage.buckets OWNER TO supabase_storage_admin; ALTER TABLE storage.objects OWNER TO supabase_storage_admin; ALTER TABLE storage.migrations OWNER TO supabase_storage_admin; GRANT ALL ON SCHEMA storage TO supabase_storage_admin; GRANT ALL ON ALL TABLES IN SCHEMA storage TO supabase_storage_admin; GRANT ALL ON ALL SEQUENCES IN SCHEMA storage TO supabase_storage_admin;"
          done

          PROFILE_ID="$(docker exec "$SOURCE18_ID" psql -U postgres -d conditera -Atqc "SELECT id::text FROM public.profiles ORDER BY id LIMIT 1")"
          if [[ ! "$PROFILE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Expected a valid profile UUID from PostgreSQL 18; received: '$PROFILE_ID'"
            exit 1
          fi
          echo "MIGRATION_PROFILE_ID=$PROFILE_ID" >> "$GITHUB_ENV"

          # PROFILE_ID came directly from the source DB and was validated as a UUID;
          # quote it as a SQL literal instead of relying on psql -v inside -c.
          docker exec -e PGPASSWORD=postgres "$SOURCE15_ID" psql -U supabase_admin -d supabase -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users (id, email, encrypted_password) VALUES ('$PROFILE_ID'::uuid, 'pg18-profile-link@example.test', 'test-hash') ON CONFLICT (id) DO NOTHING"
          docker exec -e PGPASSWORD=postgres "$SOURCE15_ID" psql -U supabase_admin -d supabase -v ON_ERROR_STOP=1 -c "INSERT INTO storage.buckets (id, name) VALUES ('media', 'media') ON CONFLICT (id) DO NOTHING"
          docker exec -e PGPASSWORD=postgres "$SOURCE15_ID" psql -U supabase_admin -d supabase -v ON_ERROR_STOP=1 -c "INSERT INTO storage.objects (bucket_id, name, owner, metadata) VALUES ('media', 'pg15-only-object.txt', '$PROFILE_ID'::uuid, '{\"source\":\"official-supabase-pg15\"}'::jsonb)"

          # The PostgreSQL 18 application fixture contains demo identities in
          # auth.users. In production their actual Supabase identities come
          # from the PG15 source; mirror every referenced test UUID there before
          # exporting Auth data so business foreign keys remain valid.
          PG18_AUTH_USER_IDS="$(docker exec "$SOURCE18_ID" psql -U postgres -d conditera -Atqc "SELECT id::text FROM auth.users ORDER BY id")"
          test -n "$PG18_AUTH_USER_IDS"
          while IFS= read -r USER_ID; do
            [[ "$USER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
              echo "Invalid Auth UUID from PG18 fixture: $USER_ID"
              exit 1
            }
            docker exec -e PGPASSWORD=postgres "$SOURCE15_ID" psql -U supabase_admin -d supabase -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users (id, email, encrypted_password) VALUES ('$USER_ID'::uuid, 'pg18-compat-$USER_ID@example.invalid', '') ON CONFLICT (id) DO NOTHING"
          done <<< "$PG18_AUTH_USER_IDS"


      - name: Merge official Supabase PG15 data and Conditera PG18 business schema into PG17
        shell: bash
        run: |
          set -euo pipefail
          SOURCE15_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "supabase/postgres:15.6.1.141" { print $1; exit }')"
          SOURCE18_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:18-alpine" { print $1; exit }')"
          TARGET_ID="$(docker ps --filter publish=5435 --format '{{.ID}}' | head -1)"
          test -n "$SOURCE15_ID"
          test -n "$SOURCE18_ID"
          test -n "$TARGET_ID"

          # Restore every Auth/Storage data table except migration ledgers:
          # schema and roles are initialized by official Supabase PG17 + Storage API migrations.
          docker exec -e PGPASSWORD=postgres "$SOURCE15_ID" pg_dump -U supabase_admin -d supabase --data-only --schema=auth --schema=storage --exclude-table=auth.schema_migrations --exclude-table=storage.migrations --no-owner --format=plain > "$RUNNER_TEMP/supabase15-auth-storage-data.sql"
          test -s "$RUNNER_TEMP/supabase15-auth-storage-data.sql"
          docker exec -e PGPASSWORD=postgres -i "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/supabase15-auth-storage-data.sql"

          # Install business-schema extensions before restoring DDL that uses
          # their operator classes (notably uuid GiST constraints).
          docker exec -e PGPASSWORD=postgres "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA extensions;"

          # Merge the Conditera business schema into the pre-initialized Supabase
          # public schema; never drop the Supabase-owned public schema itself.
          docker exec "$SOURCE18_ID" pg_dump -U postgres -d conditera --schema=public --no-owner --format=plain > "$RUNNER_TEMP/conditera18-public.sql"
          test -s "$RUNNER_TEMP/conditera18-public.sql"
          sed '/^CREATE SCHEMA public;$/d' "$RUNNER_TEMP/conditera18-public.sql" > "$RUNNER_TEMP/conditera18-public-existing-schema.sql"
          docker exec -e PGPASSWORD=postgres -i "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/conditera18-public-existing-schema.sql"

          SOURCE18_COUNTS="$(docker exec "$SOURCE18_ID" psql -U postgres -d conditera -Atqc "SELECT (SELECT count(*) FROM public.schema_migrations)::text || ':' || (SELECT count(*) FROM public.profiles)::text || ':' || (SELECT count(*) FROM public.products)::text || ':' || (SELECT count(*) FROM public.orders)::text || ':' || (SELECT count(*) FROM public.confectioner_transactions)::text;")"
          SOURCE15_COUNTS="$(docker exec -e PGPASSWORD=postgres "$SOURCE15_ID" psql -U supabase_admin -d supabase -Atqc "SELECT (SELECT count(*) FROM auth.users)::text || ':' || (SELECT count(*) FROM storage.buckets)::text || ':' || (SELECT count(*) FROM storage.objects)::text;")"
          TARGET_COUNTS="$(docker exec -e PGPASSWORD=postgres "$TARGET_ID" psql -U supabase_admin -d conditera -Atqc "SELECT (SELECT count(*) FROM public.schema_migrations)::text || ':' || (SELECT count(*) FROM public.profiles)::text || ':' || (SELECT count(*) FROM public.products)::text || ':' || (SELECT count(*) FROM public.orders)::text || ':' || (SELECT count(*) FROM public.confectioner_transactions)::text || ':' || (SELECT count(*) FROM auth.users)::text || ':' || (SELECT count(*) FROM storage.buckets)::text || ':' || (SELECT count(*) FROM storage.objects)::text;")"
          EXPECTED_COUNTS="$SOURCE18_COUNTS:$SOURCE15_COUNTS"
          echo "Expected merged counts: $EXPECTED_COUNTS"
          echo "PostgreSQL 17 single-database counts: $TARGET_COUNTS"
          test "$EXPECTED_COUNTS" = "$TARGET_COUNTS"

          ORPHANS="$(docker exec -e PGPASSWORD=postgres "$TARGET_ID" psql -U supabase_admin -d conditera -Atqc "SELECT count(*) FROM public.profiles p LEFT JOIN auth.users u ON u.id = p.id WHERE p.id = '$MIGRATION_PROFILE_ID' AND u.id IS NULL;")"
          test "$ORPHANS" = "0"
          APP_ROLE="$(docker exec -e PGPASSWORD=postgres "$TARGET_ID" psql -U supabase_admin -d conditera -Atqc "SELECT rolsuper::text || ':' || rolbypassrls::text FROM pg_roles WHERE rolname='conditera'")"
          test "$APP_ROLE" = "false:true"
          echo "OFFICIAL SUPABASE PG15 + CONDITERA PG18 -> PG17 SINGLE DATABASE MERGE PASSED"

      - name: Validate unified PostgreSQL 17 Docker Compose configuration
        env:
          POSTGRES_PASSWORD: "ci_postgres_password_32_chars_min"
          CONDITERA_DB_PASSWORD: "ci_conditera_password_32_chars"
          MEILI_MASTER_KEY: "ci_meili_master_key_32_chars_minimum"
          JWT_SECRET: "ci_jwt_secret_32_chars_minimum_aaaaaaaa"
          CRON_SECRET: "ci_cron_secret_32_chars"
          N8N_ADMIN_PASSWORD: "ci_n8n_admin_password"
          SIMPLEX_BRIDGE_API_KEY: "ci_simplex_bridge_api_key"
          ENCRYPTOR_KEY: "ci_encryptor_key_32_chars_minimum"
          SECRET_KEY_BASE: "ci_secret_key_base_64_chars_minimum_aaaaaaaaaaaaaaaa"
          ANON_KEY: "ci_anon_key"
          SERVICE_ROLE_KEY: "ci_service_role_key"
          API_EXTERNAL_URL: "http://localhost:8000"
          SITE_URL: "http://localhost:3000"
          SMTP_HOST: "localhost"
        run: |
          touch .env.production
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          bash -n scripts/init-db.sh scripts/deploy.sh scripts/update-from-archive.sh
          grep -q '^DATABASE_URL=postgresql://conditera:.*@pgbouncer:5432/conditera' .env.production.example
          grep -q '^DIRECT_DATABASE_URL=postgresql://conditera:.*@db:5432/conditera' .env.production.example
          grep -q '^CONDITERA_DB_PASSWORD=' .env.production.example
          if grep -nE "conditera-supabase-db|supabase-db|supabase_db_data" scripts/deploy.sh scripts/update-from-archive.sh; then
            echo "Legacy second-PostgreSQL references remain in operational scripts/docs"
            exit 1
          fi
          docker build --target migrator -t conditera-migrator:ci .

      - name: Build experimental single-container PostgreSQL 17 + GoTrue runtime
        run: docker build -f Dockerfile.supabase-runtime -t conditera-supabase-runtime:poc .

      - name: Start and test PostgreSQL 17 + GoTrue in one container
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER="conditera-supabase-runtime-poc"
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          cleanup() {
            docker logs "$CONTAINER" 2>&1 | tail -120 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          POSTGRES_PASSWORD_VALUE="ci_runtime_pg17_password_32_chars"
          JWT_SECRET_VALUE="ci_runtime_jwt_secret_32_chars_minimum_aaaaaaaa"
          docker run -d --name "$CONTAINER" \
            -p 127.0.0.1:15432:5432 \
            -p 127.0.0.1:19999:9999 \
            -e POSTGRES_USER=supabase_admin \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD_VALUE" \
            -e POSTGRES_DB=conditera \
            -e GOTRUE_API_HOST=0.0.0.0 \
            -e GOTRUE_API_PORT=9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:$POSTGRES_PASSWORD_VALUE@127.0.0.1:5432/conditera?search_path=auth" \
            -e GOTRUE_DB_MIGRATIONS_PATH=/usr/local/etc/auth/migrations \
            -e GOTRUE_JWT_SECRET="$JWT_SECRET_VALUE" \
            -e GOTRUE_SITE_URL=http://localhost:3000 \
            -e API_EXTERNAL_URL=http://localhost:8000 \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e GOTRUE_ENABLE_EMAIL_AUTOCONFIRM=true \
            -e GOTRUE_SMTP_HOST=127.0.0.1 \
            -e GOTRUE_SMTP_PORT=1025 \
            -e GOTRUE_SMTP_ADMIN_EMAIL=noreply@example.test \
            conditera-supabase-runtime:poc

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:19999/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "GoTrue did not become healthy inside the shared PG17 container"
            docker logs "$CONTAINER" || true
            exit 1
          fi

          docker exec "$CONTAINER" sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_isready -h 127.0.0.1 -U supabase_admin -d conditera'
          PG_MAJOR="$(docker exec "$CONTAINER" psql -U supabase_admin -d conditera -Atqc "SELECT current_setting('server_version_num')::int / 10000")"
          test "$PG_MAJOR" = "17"
          AUTH_TABLES="$(docker exec "$CONTAINER" psql -U supabase_admin -d conditera -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='auth' AND table_name IN ('users','identities','sessions','refresh_tokens','schema_migrations')")"
          test "$AUTH_TABLES" -ge 5
          docker exec "$CONTAINER" supervisorctl status
          echo "POC PASS: PostgreSQL $PG_MAJOR and GoTrue are healthy in one Docker container."

          # Verify container restart: both supervised processes must come back.
          docker restart "$CONTAINER" >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:19999/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          docker exec "$CONTAINER" supervisorctl status
          echo "POC RESTART PASS: PostgreSQL and GoTrue recovered after container restart."

  # ===== 3. Build =====
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          CRON_SECRET: "ci_test_cron_secret"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_NAME: "Уездный кондитер"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"
          DATABASE_URL: "file:./db/ci-test.db"
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # ===== 4. Docker build =====
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: conditera:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.chat
          push: false
          tags: conditera-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simplex-bridge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.simplex-bridge
          push: false
          tags: conditera-simplex-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 5. Security checks =====
  # npm audit убран: в репозитории bun.lock (npm audit требует package-lock).
  # Сканирование секретов работает без установки зависимостей.
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for secrets in code
        run: |
          # Проверка на закоммиченные секреты
          if grep -rEn "(sk_live_|pk_live_|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|glpat-)" \
            --include="*.ts" --include="*.tsx" --include="*.json" \
            --exclude-dir=node_modules src/ scripts/ mini-services/ 2>/dev/null; then
            echo "❌ Found potential secrets in code"
            exit 1
          fi
          echo "✓ No secrets found in code"

      - name: Check for .env files in repo
        run: |
          # Проверка что нет закоммиченных .env файлов с секретами
          FOUND=$(find . -maxdepth 2 -name ".env*" -not -path "./node_modules/*" -not -path "./.git/*" \
            -not -name "*.example" -not -name "*.template" | head -5)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Found .env files in repository (review them):"
            echo "$FOUND"
          fi
          echo "✓ Secret files check complete"

  # ===== 6. Validate Caddyfile =====
  validate-caddyfile:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Caddyfile syntax
        run: |
          if [ ! -f Caddyfile ]; then
            echo "Caddyfile not found, skipping"
            exit 0
          fi
          # Используем caddy image для валидации
          docker run --rm -v $(pwd)/Caddyfile:/etc/caddy/Caddyfile caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
