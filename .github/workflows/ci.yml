# ============================================================
# CI/CD для «Уездный кондитер» (v2.0 — Supabase, bun)
# ============================================================
# Запускается на каждый push в main и на каждый PR.
# Pipeline: lint → typecheck → test → build → docker-build → security.
# Все шаги — строгие (БЕЗ continue-on-error, кроме coverage). Любая ошибка ломает CI.
#
# v2.0 изменения:
#   • Prisma УДАЛЕНА из проекта — шаги `npx prisma generate` убраны
#   • Пакетный менеджер — bun (bun.lock — источник истины, package-lock.json удалён)
#   • Playwright E2E вынесен в отдельный workflow e2e.yml (nightly + ручной запуск)
#   • Job smoke-test-db убран: скрипт использовал Prisma-API, несовместимый с v2.0
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ===== 1. Lint + Type-check =====
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck
        # СТРОГО: любая TS-ошибка ломает CI. Никаких continue-on-error.

      - name: Lint
        run: bun run lint
        # СТРОГО: eslint ошибки ломают CI.

  # ===== 2. Unit tests (Vitest) =====
  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          # vitest.setup.ts сам выставляет NEXT_PUBLIC_SUPABASE_URL/ANON_KEY заглушки

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
        continue-on-error: true  # coverage не должен ломать CI, но отчёт нужен

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ===== PostgreSQL 17 compatibility =====
  postgres-17-compatibility:
    name: PostgreSQL 17 — full SQL migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conditera
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conditera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres15:
        image: supabase/postgres:15.6.1.141
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supabase
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d supabase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres17_app:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conditera
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d conditera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply and verify every SQL migration on Supabase PostgreSQL 17
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
        run: node scripts/db/verify-pg17.mjs

      - name: Prepare PostgreSQL 18 Conditera source
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/conditera
          EXPECTED_POSTGRES_MAJOR: "18"
          SKIP_UNAVAILABLE_EXTENSIONS: "1"
        run: |
          node scripts/db/verify-pg17.mjs
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/conditera node scripts/db/setup.mjs --seed-only

      - name: Prepare PostgreSQL 15 Supabase source and preserve auth/storage data
        shell: bash
        run: |
          set -euo pipefail
          SOURCE15_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:15-alpine" { print $1; exit }')"
          SOURCE18_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:18-alpine" { print $1; exit }')"
          test -n "$SOURCE15_ID"
          test -n "$SOURCE18_ID"

          docker cp supabase/compat/0000_supabase_compat.sql "$SOURCE15_ID:/tmp/compat.sql"
          docker exec "$SOURCE15_ID" psql -U postgres -d supabase -v ON_ERROR_STOP=1 -f /tmp/compat.sql
          docker exec "$SOURCE15_ID" psql -U postgres -d supabase -v ON_ERROR_STOP=1 -c "TRUNCATE auth.users, storage.objects, storage.buckets CASCADE"

          docker exec "$SOURCE18_ID" pg_dump -U postgres -d conditera --data-only --schema=auth --schema=storage --no-owner > "$RUNNER_TEMP/auth-storage-data.sql"
          test -s "$RUNNER_TEMP/auth-storage-data.sql"
          # The PG18 client adds a setting unknown to PG15; remove only that
          # client-side SET line for this fixture transfer (data/DDL unchanged).
          sed '/^SET transaction_timeout = 0;$/d' "$RUNNER_TEMP/auth-storage-data.sql" > "$RUNNER_TEMP/auth-storage-data-pg15.sql"
          docker exec -i "$SOURCE15_ID" psql -U postgres -d supabase -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/auth-storage-data-pg15.sql"

          docker exec "$SOURCE15_ID" psql -U postgres -d supabase -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users (id, email, encrypted_password) VALUES ('00000000-0000-4000-8000-000000000015', 'pg15-only@example.test', 'test-hash') ON CONFLICT (id) DO NOTHING"
          docker exec "$SOURCE15_ID" psql -U postgres -d supabase -v ON_ERROR_STOP=1 -c "INSERT INTO storage.objects (bucket_id, name, owner, metadata) VALUES ('media', 'pg15-only-object.txt', '00000000-0000-4000-8000-000000000015', '{\"source\":\"pg15\"}'::jsonb)"

      - name: Merge PostgreSQL 15 Supabase schemas and PostgreSQL 18 Conditera data into PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          SOURCE15_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:15-alpine" { print $1; exit }')"
          SOURCE18_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:18-alpine" { print $1; exit }')"
          TARGET_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "supabase/postgres:17.6.1.136" { print $1; exit }')"
          test -n "$SOURCE15_ID"
          test -n "$SOURCE18_ID"
          test -n "$TARGET_ID"

          docker exec "$TARGET_ID" createdb -U supabase_admin -T template0 conditera
          docker exec "$TARGET_ID" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE conditera SET search_path TO public, extensions"
          docker exec -i "$TARGET_ID" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase') THEN
              EXECUTE 'CREATE ROLE supabase NOLOGIN';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'conditera') THEN
              EXECUTE 'CREATE ROLE conditera NOLOGIN';
            END IF;
          END
          $do$;
          SQL
          docker exec "$TARGET_ID" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET cron.database_name = 'conditera'"
          docker restart "$TARGET_ID" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$TARGET_ID" pg_isready -U supabase_admin -d postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$TARGET_ID" pg_isready -U supabase_admin -d postgres

          docker exec "$SOURCE15_ID" pg_dump -U postgres -d supabase --no-owner --format=plain --exclude-schema=public > "$RUNNER_TEMP/supabase15-system.sql"
          test -s "$RUNNER_TEMP/supabase15-system.sql"
          docker exec -i "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/supabase15-system.sql"

          docker exec "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS extensions; CREATE SCHEMA IF NOT EXISTS pgsodium; CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" WITH SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS pgsodium WITH SCHEMA pgsodium; CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA extensions;"

          docker exec "$SOURCE18_ID" pg_dump -U postgres -d conditera --schema=public --no-owner --format=plain > "$RUNNER_TEMP/conditera18-public.sql"
          test -s "$RUNNER_TEMP/conditera18-public.sql"
          docker exec "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS public CASCADE"
          if ! grep -q "CREATE SCHEMA public" "$RUNNER_TEMP/conditera18-public.sql"; then
            docker exec "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 -c "CREATE SCHEMA public AUTHORIZATION supabase_admin"
          fi
          docker exec -i "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/conditera18-public.sql"

          docker exec "$TARGET_ID" psql -U supabase_admin -d conditera -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION IF NOT EXISTS pg_cron WITH SCHEMA extensions"

          SOURCE18_COUNTS="$(docker exec "$SOURCE18_ID" psql -U postgres -d conditera -Atqc "SELECT (SELECT count(*) FROM public.schema_migrations)::text || ':' || (SELECT count(*) FROM public.profiles)::text || ':' || (SELECT count(*) FROM public.products)::text || ':' || (SELECT count(*) FROM public.orders)::text || ':' || (SELECT count(*) FROM public.confectioner_transactions)::text;")"
          SOURCE15_COUNTS="$(docker exec "$SOURCE15_ID" psql -U postgres -d supabase -Atqc "SELECT (SELECT count(*) FROM auth.users)::text || ':' || (SELECT count(*) FROM storage.buckets)::text || ':' || (SELECT count(*) FROM storage.objects)::text;")"
          TARGET_COUNTS="$(docker exec "$TARGET_ID" psql -U supabase_admin -d conditera -Atqc "SELECT (SELECT count(*) FROM public.schema_migrations)::text || ':' || (SELECT count(*) FROM public.profiles)::text || ':' || (SELECT count(*) FROM public.products)::text || ':' || (SELECT count(*) FROM public.orders)::text || ':' || (SELECT count(*) FROM public.confectioner_transactions)::text || ':' || (SELECT count(*) FROM auth.users)::text || ':' || (SELECT count(*) FROM storage.buckets)::text || ':' || (SELECT count(*) FROM storage.objects)::text;")"
          EXPECTED_COUNTS="$SOURCE18_COUNTS:$SOURCE15_COUNTS"
          echo "Expected merged counts: $EXPECTED_COUNTS"
          echo "PostgreSQL 17 merged counts: $TARGET_COUNTS"
          test "$EXPECTED_COUNTS" = "$TARGET_COUNTS"
          ORPHANS="$(docker exec "$TARGET_ID" psql -U supabase_admin -d conditera -Atqc "SELECT count(*) FROM public.profiles p LEFT JOIN auth.users u ON u.id = p.id WHERE u.id IS NULL;")"
          test "$ORPHANS" = "0"
          echo "SUPABASE PG15 + CONDITERA PG18 -> PG17 MERGE PASSED"

      - name: Validate unified PostgreSQL 17 Docker Compose configuration
        env:
          POSTGRES_PASSWORD: "ci_postgres_password_32_chars_min"
          CONDITERA_DB_PASSWORD: "ci_conditera_password_32_chars"
          MEILI_MASTER_KEY: "ci_meili_master_key_32_chars_minimum"
          JWT_SECRET: "ci_jwt_secret_32_chars_minimum_aaaaaaaa"
          CRON_SECRET: "ci_cron_secret_32_chars"
          N8N_ADMIN_PASSWORD: "ci_n8n_admin_password"
          SIMPLEX_BRIDGE_API_KEY: "ci_simplex_bridge_api_key"
          ENCRYPTOR_KEY: "ci_encryptor_key_32_chars_minimum"
          SECRET_KEY_BASE: "ci_secret_key_base_64_chars_minimum_aaaaaaaaaaaaaaaa"
          ANON_KEY: "ci_anon_key"
          SERVICE_ROLE_KEY: "ci_service_role_key"
          API_EXTERNAL_URL: "http://localhost:8000"
          SITE_URL: "http://localhost:3000"
          SMTP_HOST: "localhost"
        run: |
          touch .env.production
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker build --target migrator -t conditera-migrator:ci .

  # ===== 3. Build =====
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js
        env:
          JWT_SECRET: "ci_test_jwt_secret_32_chars_min_aaaaaaaaaaaaaa"
          TFA_ENCRYPTION_KEY: "ci_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
          CRON_SECRET: "ci_test_cron_secret"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_NAME: "Уездный кондитер"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"
          DATABASE_URL: "file:./db/ci-test.db"
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # ===== 4. Docker build =====
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: conditera:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.chat
          push: false
          tags: conditera-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simplex-bridge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.simplex-bridge
          push: false
          tags: conditera-simplex-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 5. Security checks =====
  # npm audit убран: в репозитории bun.lock (npm audit требует package-lock).
  # Сканирование секретов работает без установки зависимостей.
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for secrets in code
        run: |
          # Проверка на закоммиченные секреты
          if grep -rEn "(sk_live_|pk_live_|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|glpat-)" \
            --include="*.ts" --include="*.tsx" --include="*.json" \
            --exclude-dir=node_modules src/ scripts/ mini-services/ 2>/dev/null; then
            echo "❌ Found potential secrets in code"
            exit 1
          fi
          echo "✓ No secrets found in code"

      - name: Check for .env files in repo
        run: |
          # Проверка что нет закоммиченных .env файлов с секретами
          FOUND=$(find . -maxdepth 2 -name ".env*" -not -path "./node_modules/*" -not -path "./.git/*" \
            -not -name "*.example" -not -name "*.template" | head -5)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Found .env files in repository (review them):"
            echo "$FOUND"
          fi
          echo "✓ Secret files check complete"

  # ===== 6. Validate Caddyfile =====
  validate-caddyfile:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Caddyfile syntax
        run: |
          if [ ! -f Caddyfile ]; then
            echo "Caddyfile not found, skipping"
            exit 0
          fi
          # Используем caddy image для валидации
          docker run --rm -v $(pwd)/Caddyfile:/etc/caddy/Caddyfile caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
