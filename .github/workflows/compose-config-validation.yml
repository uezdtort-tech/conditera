name: Docker Compose configuration validation

on:
  push:
    branches:
      - fix/postgres17-supabase-consolidation
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "docker-compose.supabase.yml"
      - "scripts/db/docker-dev-init.sh"
      - "scripts/db/ensure-supabase-init.sh"
      - "supabase/pg17-init/**"
      - "supabase/migrations/**"
      - "supabase/seed*.sql"
      - "supabase/init-scripts/01-apply-migrations.sh"
      - "scripts/ops/pg17-init/**"
      - ".github/workflows/compose-config-validation.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "docker-compose.supabase.yml"
      - "scripts/db/docker-dev-init.sh"
      - "scripts/db/ensure-supabase-init.sh"
      - "supabase/pg17-init/**"
      - "supabase/migrations/**"
      - "supabase/seed*.sql"
      - "supabase/init-scripts/01-apply-migrations.sh"
      - "scripts/ops/pg17-init/**"
      - ".github/workflows/compose-config-validation.yml"
  workflow_dispatch:

concurrency:
  group: compose-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: "ci-only-postgres-password"
      MEILI_MASTER_KEY: "ci-only-meili-master-key-32-characters"
      JWT_SECRET: "ci-only-jwt-secret-at-least-32-characters-long"
      CRON_SECRET: "ci-only-cron-secret-at-least-32-characters"
      N8N_ADMIN_PASSWORD: "ci-only-n8n-password"
      SIMPLEX_BRIDGE_API_KEY: "ci-only-simplex-api-key"
      ENCRYPTOR_KEY: "01234567890123456789012345678901"
      SECRET_KEY_BASE: "0123456789012345678901234567890123456789012345678901234567890123"
      ANON_KEY: "ci-only-anon-key"
      SERVICE_ROLE_KEY: "ci-only-service-role-key"
      SMTP_HOST: "localhost"
      SMTP_USER: "ci"
      SMTP_PASSWORD: "ci"
    steps:
      - uses: actions/checkout@v4
      - name: Create empty CI-only env files
        run: touch .env.production mailu.env
      - name: Validate production Compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate development Compose
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Validate Supabase Compose
        run: docker compose -f docker-compose.supabase.yml config --quiet
      - name: Start PostgreSQL 17 dev database and Storage API migrations
        run: docker compose -f docker-compose.dev.yml up -d db-dev supabase-storage-dev
      - name: Wait for dev Storage API migrations
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{.State.Health.Status}}' uyezdny-storage-dev 2>/dev/null || true)"
            if [[ "$health" == "healthy" ]]; then
              echo "Dev Storage API migrations completed"
              exit 0
            fi
            state="$(docker inspect --format '{{.State.Status}}' uyezdny-storage-dev 2>/dev/null || true)"
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              docker compose -f docker-compose.dev.yml logs supabase-storage-dev
              exit 1
            fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yml logs supabase-storage-dev
          echo "Dev Storage API did not become healthy"
          exit 1
      - name: Apply Conditera dev migrations
        run: docker compose -f docker-compose.dev.yml run --rm conditera-migrator-dev
      - name: Verify dev database and core schema
        shell: bash
        run: |
          db_ready=0
          for attempt in $(seq 1 90); do
            exists="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d template1 -Atc "SELECT 1 FROM pg_database WHERE datname='uyezdny_konditer_dev'" 2>/dev/null || true)"
            if [[ "$exists" == "1" ]]; then
              db_ready=1
              break
            fi
            sleep 2
          done
          [[ "$db_ready" == "1" ]] || { echo "Target dev database was not created"; docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d template1 -Atc 'SELECT datname FROM pg_database' || true; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          version="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d uyezdny_konditer_dev -Atc 'SHOW server_version_num')"
          [[ "$version" == 17* ]] || { echo "Expected PostgreSQL 17, got $version"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          count="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U uyezdny -d uyezdny_konditer_dev -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('profiles','user_roles','products','orders','schema_migrations')")"
          [[ "$count" == "5" ]] || { echo "Core Conditera tables missing: $count/5"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          roles="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d uyezdny_konditer_dev -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','supabase_admin','postgres','uyezdny')")"
          [[ "$roles" == "6" ]] || { echo "Expected six Supabase/app roles, got $roles"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          echo "PostgreSQL $version; core Conditera tables=$count/5; roles=$roles/6"
          schema_count="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d uyezdny_konditer_dev -Atc "SELECT count(*) FROM pg_namespace WHERE nspname IN ('auth','storage','extensions','_realtime','supabase_functions')")"
          [[ "$schema_count" == "5" ]] || { echo "Supabase dev schemas missing: $schema_count/5"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          auth_users="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d uyezdny_konditer_dev -Atc "SELECT to_regclass('auth.users') IS NOT NULL")"
          [[ "$auth_users" == "t" ]] || { echo "Dev auth.users is missing"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          supabase_db="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d uyezdny_konditer_dev -Atc "SELECT 1 FROM pg_database WHERE datname='_supabase'")"
          [[ "$supabase_db" == "1" ]] || { echo "Dev _supabase database is missing"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          analytics_count="$(docker compose -f docker-compose.dev.yml exec -T db-dev env PGPASSWORD=uyezdny_dev_pass PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -U supabase_admin -d _supabase -Atc "SELECT count(*) FROM pg_namespace WHERE nspname IN ('_analytics','_supavisor')")"
          [[ "$analytics_count" == "2" ]] || { echo "Dev internal schemas missing: $analytics_count/2"; docker compose -f docker-compose.dev.yml logs db-dev; exit 1; }
          docker compose -f docker-compose.dev.yml exec -T db-dev sh -lc 'test -s /etc/postgresql-custom/pgsodium_root.key'
          echo "Dev pgsodium root key persisted in its dedicated config volume"
      - name: Stop dev database
        if: always()
        run: docker compose -f docker-compose.dev.yml down
