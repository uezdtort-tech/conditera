name: Refresh Bun lock for PostgreSQL 17 runtime

on:
  push:
    branches:
      - fix/postgres17-supabase-consolidation
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postgres17-supabase-consolidation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Resolve PostgreSQL 17 platform binaries
        run: bun install --lockfile-only
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: lock embedded PostgreSQL 17 binaries"
          git push origin HEAD:fix/postgres17-supabase-consolidation
