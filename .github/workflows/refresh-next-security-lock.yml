name: Refresh Next.js security lockfile

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/refresh-next-security-lock.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update vulnerable Next.js packages
        run: bun update next@16.4.5 eslint-config-next@16.4.5

      - name: Verify frozen lockfile and package versions
        run: |
          bun install --frozen-lockfile
          node -e 'const p=require("./package.json"); if (!p.dependencies.next.startsWith("^16.4.5") && p.dependencies.next !== "16.4.5") process.exit(1); if (!p.devDependencies["eslint-config-next"].startsWith("^16.4.5") && p.devDependencies["eslint-config-next"] !== "16.4.5") process.exit(1);'

      - name: Upload updated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: next-security-lockfile
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 3
