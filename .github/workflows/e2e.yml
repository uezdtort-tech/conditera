# ============================================================
# E2E Tests — отдельный workflow для расширенного запуска Playwright
# (v2.0: bun, без Prisma — клиент генерируется из Supabase-типов)
# ============================================================
# Запускается:
#   • По расписанию: nightly в 03:00 UTC
#   • При изменениях в API routes или e2e тестах
#   • Вручную (workflow_dispatch) с фильтром grep
#
# Pipeline: install → build → start preview → run Playwright → upload report
#
# Отличие от ci.yml:
#   • Запускается отдельно (не блокирует основной CI)
#   • Загружает HTML-отчёт как артефакт
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА (variant B, 2026-10-15): матрица зафиксирована на chromium.
# playwright.config.ts активирует только chromium + mobile-chrome — проекты
# firefox/webkit закомментированы, поэтому nightly-джобы этих браузеров падали
# с "project not found" независимо от состояния БД (run 38701876670).
# TODO(future-task): полноценное покрытие Firefox/WebKit — раскомментировать
# проекты в playwright.config.ts, прогнать спеки на обоих движках и только
# после этого вернуть их в матрицу (и опцию "all" в workflow_dispatch).
# ============================================================

name: E2E Tests

# Один актуальный прогон на ветку: push + pull_request не должны
# одновременно занимать runner-ы идентичными Chromium/mobile E2E.
concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  schedule:
    # Nightly в 03:00 UTC — chromium-only (см. «РЕШЕНИЕ ВЛАДЕЛЬЦА» в шапке)
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      # Параметр browser (firefox/webkit/all) удалён: проекты не активированы
      # в playwright.config.ts — интерфейс не должен предлагать неподдерживаемые
      # варианты. Вернуть вместе с TODO(future-task) из шапки.
      grep:
        description: "Фильтр тестов (regex, пусто = все)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main
      - develop
      - "integration/**"
    paths:
      # Запускать только при изменениях в коде, который тестируется e2e
      - "src/app/**"
      - "src/app/api/**"
      - "src/components/**"
      - "src/lib/**"
      - "scripts/db/**"
      - "scripts/verify/**"
      - "supabase/migrations/**"
      - "docker-compose*.yml"
      - "Dockerfile*"
      - ".env*.example"
      - ".github/workflows/**"
      - "package.json"
      - "bun.lock"
      - "src/proxy.ts"
      - "src/middleware.test.ts"
      - "src/lib/postgrest/**"
      - ".github/workflows/e2e.yml"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/e2e.yml"
      - "src/app/api/**"
      - "src/components/**"
      - "src/lib/**"
      - "src/proxy.ts"
      - "src/middleware.test.ts"
      - "src/lib/postgrest/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"

env:
  NODE_VERSION: "26"
  # Локальный PostgreSQL (embedded, без Docker) — источник данных для шима
  # /rest/v1 и всех API. Раньше здесь был legacy file:./db/e2e-test.db, а саму
  # БД никто не поднимал — все API-тесты E2E падали (53+ ошибок CI).
  DATABASE_URL: "postgresql://postgres@127.0.0.1:54329/conditera"
  JWT_SECRET: "e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa"
  JWT_REFRESH_SECRET: "e2e_test_refresh_secret_32_chars_min_aaaaaaaaaa"
  TFA_ENCRYPTION_KEY: "e2e_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
  CRON_SECRET: "e2e_test_cron_secret"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:3000"
  SUPABASE_INTERNAL_URL: "http://127.0.0.1:3000"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-only-anon-key-not-for-deploy"
  NODE_ENV: test
  # Only this CI workflow runs against loopback; enables the guarded mock
  # payment provider for browser/integration scenarios without live credentials.
  E2E_PAYMENT_STUB_ENABLED: "true"
  YANDEX_CLIENT_ID: e2e-yandex-client
  YANDEX_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/yandex/callback
  VK_CLIENT_ID: e2e-vk-client
  VK_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/vk/callback
  GOOGLE_CLIENT_ID: e2e-google-client
  GOOGLE_CLIENT_SECRET: ${{ github.run_id }}
  GOOGLE_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/google/callback
  CI: "true"

jobs:
  # ===== 1. Установка и сборка =====
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build application
        run: bun run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}
          # Next.js компилирует клиентский bundle как production независимо от NODE_ENV=test.
          # Явно включаем demoSeed только в изолированном E2E workflow, иначе
          # MOCK_CONFECTIONERS становится пустым и /dashboard падает на confectioner.tariff.
          NEXT_PUBLIC_DEMO_MODE: "1"

      - name: Cache build for downstream
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

  # ===== 2. Запуск Playwright тестов =====
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # Проверяем реальный desktop и mobile UI; mobile-chrome использует Chromium
        # с viewport/device-профилем Pixel 5 из playwright.config.ts.
        project: ["chromium", "mobile-chrome"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap embedded PostgreSQL + migrations + seed
        run: |
          node scripts/db/runtime.mjs start
          bun run db:setup
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:54329/conditera
          JWT_SECRET: e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

      - name: Start embedded PostgreSQL, apply migrations and seed E2E data
        run: bun run db:setup
        env:
          SEED_MODE: demo
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: Seed isolated orderable product for browser checkout
        run: node scripts/db/seed-e2e-orderable-product.mjs
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed isolated buyer and confectioner accounts for profile E2E
        shell: bash
        run: |
          node scripts/db/seed-e2e-profile-users.mjs | tee /tmp/e2e-profile-accounts.log
          sed -n '/^PROFILE_E2E_/p' /tmp/e2e-profile-accounts.log >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Export generated Supabase service-role key to CI runtime
        shell: bash
        run: |
          KEY="$(sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' .env.local | tail -n 1)"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY was not generated by db:setup"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start application
        run: |
          # Сохраняем stdout/stderr Next.js для диагностики серверных 500.
          bun run start > /tmp/conditera-next.log 2>&1 &
          echo $! > /tmp/conditera-next.pid
          READY=0
          for i in {1..30}; do
            # theirs: STATUS-захват для диагностики; URL 127.0.0.1 (наш фикс
            # ::1-резолва localhost, см. E2E_BASE_URL ниже) — сервер слушает 0.0.0.0
            STATUS="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Application is up"
              READY=1
              break
            fi
            echo "  Waiting for app to start... ($i/30, HTTP ${STATUS:-no response})"
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Application did not become healthy. Last Next.js logs:"
            tail -n 250 /tmp/conditera-next.log || true
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: Run Playwright tests
        run: |
          # E2E_GREP передаётся через env (см. блок env ниже), а не текстуальной
          # встроенной подстановкой GitHub Actions: расширение "$E2E_GREP" внутри bash-массива не
          # ре-парсится shell'ом — ввод dispatch не разорвёт кавычки и не
          # внедрит команды (защита от shell injection, TZ v4.0 §6).
          ARGS=(--project=${{ matrix.project }})
          if [ -n "$E2E_GREP" ]; then
            ARGS+=(--grep "$E2E_GREP")
          fi
          bun run test:e2e -- "${ARGS[@]}"
        env:
          # Сервер уже запущен предыдущим шагом — запрещаем playwright
          # поднимать собственный webServer (иначе конфликт порта 3000).
          # 127.0.0.1 (не localhost): Node ≥17 резолвит localhost в ::1,
          # сервер слушает 0.0.0.0 — API-тесты падали с ECONNREFUSED ::1:3000
          E2E_BASE_URL: http://127.0.0.1:3000
          # Фильтр grep через env вместо inline-подстановки — защита от shell
          # injection/разрыва кавычек при workflow_dispatch.
          E2E_GREP: ${{ github.event.inputs.grep }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}
          CI: "true"

      - name: Print Next.js server logs on E2E failure
        if: failure() || cancelled()
        run: |
          echo "===== Conditera Next.js server log (last 500 lines) ====="
          tail -n 500 /tmp/conditera-next.log || true

      - name: Upload Next.js server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-server-log-${{ matrix.project }}
          path: /tmp/conditera-next.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (XML)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots and videos on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures-${{ matrix.project }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: warn

  # ===== 3. Отчёт в Slack/Telegram (опционально) =====
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram notification
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔴 E2E Tests FAILED

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Failed job: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  # ===== Integration verifies (DEPLOY-01 §6 п.7-10, §13) =====
  # Реальные интеграционные проверки против embedded PostgreSQL + живого
  # сервера (не mock): ops-center, checkout-idempotency, order lifecycle,
  # диагностика (error→incident), money path. Обновляются вместе с CI-гейтами.
  integration:
    name: Integration verifies (real PG + live server)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap embedded PostgreSQL + migrations + demo fixtures for integration scenarios
        run: |
          node scripts/db/runtime.mjs start
          bun run db:setup
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:54329/conditera
          JWT_SECRET: e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa
          SEED_MODE: demo

      - name: Export generated Supabase service-role key to integration runtime
        run: |
          set -euo pipefail
          KEY="$(sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' .env.local | tail -n 1)"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY was not generated by db:setup"
            exit 1
          fi
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

      - name: Start application
        run: |
          bun run start > /tmp/conditera-integration-next.log 2>&1 &
          echo $! > /tmp/conditera-integration-next.pid
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health | grep -q "200"; then
              echo "✓ Application is up"
              break
            fi
            echo "  Waiting for app... ($i/30)"
            sleep 2
          done
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          E2E_PAYMENT_STUB_ENABLED: "true"

      - name: Run integration verifies
        run: |
          set -e
          node scripts/verify/ops-center-verify.mjs
          node scripts/verify/checkout-idempotency-verify.mjs
          node scripts/verify/order-lifecycle-verify.mjs
          node scripts/verify/p11-hardening-verify.mjs
          node scripts/verify/diagnostics-verify.mjs
        env:
          VERIFY_TEST_IP: 10.250.250.250
          PGURL: ${{ env.DATABASE_URL }}
          VERIFY_BASE: http://127.0.0.1:3000

      - name: Print integration server logs on failure
        if: failure() || cancelled()
        run: |
          echo "===== Conditera integration Next.js server log ====="
          tail -n 500 /tmp/conditera-integration-next.log || true
