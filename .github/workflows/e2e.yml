# ============================================================
# E2E Tests — отдельный workflow для расширенного запуска Playwright
# (v2.0: bun, без Prisma — клиент генерируется из Supabase-типов)
# ============================================================
# Запускается:
#   • По расписанию: nightly в 03:00 UTC
#   • При изменениях в API routes или e2e тестах
#   • Вручную (workflow_dispatch) с параметром браузера
#
# Pipeline: install → build → start preview → run Playwright → upload report
#
# Отличие от ci.yml:
#   • Запускается отдельно (не блокирует основной CI)
#   • Поддерживает все 3 браузера (chromium, firefox, webkit)
#   • Загружает HTML-отчёт как артефакт
# ============================================================

name: E2E Tests

on:
  schedule:
    # Nightly в 03:00 UTC — полный smoke для всех браузеров
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      browser:
        description: "Браузер (chromium, firefox, webkit, или all)"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      grep:
        description: "Фильтр тестов (regex, пусто = все)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main
      - develop
      - release/first-production-hardening
      - fix/webhook-verify-before-ledger
      - fix/concurrent-login-refresh-jti-race
    paths:
      # Запускать при изменениях API, миграций, сценария полного заказа или самого workflow.
      - ".github/workflows/e2e.yml"
      - "supabase/migrations/**"
      - "scripts/verify/order-lifecycle-verify.mjs"
      - "scripts/verify/refund-concurrency-pg.mjs"
      - "scripts/verify/p11-hardening-verify.mjs"
      - "scripts/verify/ops-center-verify.mjs"
      - "scripts/verify/product-media-verify.mjs"
      - "src/app/**"
      - "src/app/api/**"
      - "src/components/**"
      - "src/lib/**"
      - "src/proxy.ts"
      - "src/middleware.test.ts"
      - "src/lib/postgrest/**"
      - "tests/e2e/**"
      - "n8n-workflows/**"
      - "scripts/verify/n8n-workflows-verify.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"

  pull_request:
    branches:
      - main
      - develop
      - release/first-production-hardening
    paths:
      - ".github/workflows/e2e.yml"
      - "scripts/verify/refund-concurrency-pg.mjs"
      - "scripts/verify/order-lifecycle-verify.mjs"
      - "scripts/verify/p11-hardening-verify.mjs"
      - "scripts/verify/ops-center-verify.mjs"
      - "scripts/verify/product-media-verify.mjs"
      - "supabase/migrations/**"
      - "src/app/**"
      - "src/app/api/**"
      - "src/components/**"
      - "src/lib/**"
      - "src/proxy.ts"
      - "src/middleware.test.ts"
      - "src/lib/postgrest/**"
      - "tests/e2e/**"
      - "n8n-workflows/**"
      - "scripts/verify/n8n-workflows-verify.mjs"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"

env:
  NODE_VERSION: "20"
  # Используем PGlite для изолированных тестов
  DATABASE_URL: "file:./db/e2e-test.db"
  JWT_SECRET: "e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa"
  JWT_REFRESH_SECRET: "e2e_test_refresh_secret_32_chars_min_aaaaaaaaaa"
  TFA_ENCRYPTION_KEY: "e2e_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
  CRON_SECRET: "e2e_test_cron_secret"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:3000"
  SUPABASE_INTERNAL_URL: "http://127.0.0.1:3000"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"
  NODE_ENV: test
  LOCAL_AUTH_STUB_ENABLED: "true"
  E2E_PAYMENT_STUB_ENABLED: "true"
  YANDEX_CLIENT_ID: e2e-yandex-client
  YANDEX_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/yandex/callback
  VK_CLIENT_ID: e2e-vk-client
  VK_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/vk/callback
  GOOGLE_CLIENT_ID: e2e-google-client
  GOOGLE_CLIENT_SECRET: e2e-google-secret
  GOOGLE_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/google/callback
  CI: "true"

jobs:
  # ===== 1. Установка и сборка =====
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify n8n retention workflow contracts
        run: bun scripts/verify/n8n-workflows-verify.mjs

      - name: Run acceptance and production-time unit tests
        run: bunx vitest run src/lib/ops/risk.test.ts

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build application
        run: bun run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Cache build for downstream
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

  # ===== 2. Запуск Playwright тестов =====
  test:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # По умолчанию только chromium, для nightly — все 3 браузера
        browser: ${{ github.event.inputs.browser == 'all' && fromJson('["chromium","firefox","webkit","mobile-chrome"]') || (github.event.inputs.browser && fromJson(format('["{0}"]', github.event.inputs.browser))) || (github.event_name == 'schedule' && fromJson('["chromium","firefox","webkit","mobile-chrome"]')) || fromJson('["chromium","mobile-chrome"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

      - name: Start embedded PostgreSQL, apply migrations and seed E2E data
        run: bun run db:setup
        env:
          SEED_MODE: demo
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: Verify concurrent YooKassa refunds on independent PostgreSQL sessions
        run: node scripts/verify/refund-concurrency-pg.mjs
        env:
          PGURL: postgresql://postgres@127.0.0.1:54329/conditera

      - name: Export generated Supabase service-role key to CI runtime
        shell: bash
        run: |
          KEY="$(sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' .env.local | tail -n 1)"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY was not generated by db:setup"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: |
          if [ "${{ matrix.browser }}" = "mobile-chrome" ]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Start application
        run: |
          # Сохраняем stdout/stderr Next.js для диагностики серверных 500.
          bun run start > /tmp/conditera-next.log 2>&1 &
          echo $! > /tmp/conditera-next.pid
          READY=0
          for i in {1..30}; do
            STATUS="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Application is up"
              READY=1
              break
            fi
            echo "  Waiting for app to start... ($i/30, HTTP ${STATUS:-no response})"
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Application did not become healthy. Last Next.js logs:"
            tail -n 250 /tmp/conditera-next.log || true
            exit 1
          fi
        env:
          DATABASE_URL: "postgresql://postgres@127.0.0.1:54329/conditera"
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Run full order lifecycle regression (registration → production → handoff)
        run: node scripts/verify/order-lifecycle-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: postgresql://postgres@127.0.0.1:54329/conditera

      - name: Verify payment, checkout, idempotency, reviews and chat scenarios
        run: node scripts/verify/p11-hardening-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: postgresql://postgres@127.0.0.1:54329/conditera

      - name: Verify ops center, recipe breakdown and stock scenarios
        run: node scripts/verify/ops-center-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: postgresql://postgres@127.0.0.1:54329/conditera

      - name: Verify product media, moderation and storage scenarios
        run: node scripts/verify/product-media-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: postgresql://postgres@127.0.0.1:54329/conditera

      - name: Run Playwright tests
        run: bun run test:e2e -- --project=${{ matrix.browser }} ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}
        env:
          # Сервер уже запущен предыдущим шагом — запрещаем playwright
          # поднимать собственный webServer (иначе конфликт порта 3000)
          E2E_BASE_URL: http://localhost:3000
          DATABASE_URL: "postgresql://postgres@127.0.0.1:54329/conditera"
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}
          CI: "true"

      - name: Print Next.js server logs on E2E failure
        if: failure() || cancelled()
        run: |
          echo "===== Conditera Next.js server log (last 500 lines) ====="
          tail -n 500 /tmp/conditera-next.log || true

      - name: Upload Next.js server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-server-log-${{ matrix.browser }}
          path: /tmp/conditera-next.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (XML)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: test-results/**/test-video.webm
          retention-days: 7

  # ===== 3. Полный сценарный прогон на PostgreSQL 15 (временная совместимость) =====
  pg15-scenarios:
    name: PostgreSQL 15 — полный набор сценариев
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: conditera
          POSTGRES_PORT: 5432
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
          SEED_MODE: none
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d conditera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      NODE_VERSION: "20"
      DATABASE_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:54322/conditera
      JWT_SECRET: e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa
      JWT_REFRESH_SECRET: e2e_test_refresh_secret_32_chars_min_aaaaaaaaaa
      TFA_ENCRYPTION_KEY: e2e_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa
      CRON_SECRET: e2e_test_cron_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3000
      SUPABASE_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
      NODE_ENV: test
      LOCAL_AUTH_STUB_ENABLED: "true"
      E2E_PAYMENT_STUB_ENABLED: "true"
      YANDEX_CLIENT_ID: e2e-yandex-client
      YANDEX_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/yandex/callback
      VK_CLIENT_ID: e2e-vk-client
      VK_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/vk/callback
      GOOGLE_CLIENT_ID: e2e-google-client
      GOOGLE_CLIENT_SECRET: e2e-google-secret
      GOOGLE_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/google/callback
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore application build
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

      - name: Apply all migrations and seed isolated PostgreSQL 15
        run: bun run db:setup
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SEED_MODE: demo
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NODE_ENV: test

      - name: Assert PostgreSQL 15 version and complete migration ledger
        run: |
          node --input-type=module <<'NODE'
          import { Client } from "pg";
          const db = new Client({ connectionString: process.env.DATABASE_URL });
          await db.connect();
          try {
            const version = (await db.query("SHOW server_version")).rows[0].server_version;
            const migrations = await db.query("SELECT count(*)::int AS n FROM public.schema_migrations");
            const count = migrations.rows[0].n;
            console.log(`PostgreSQL server_version=${version}; applied app migrations=${count}`);
            if (!version.startsWith("15.")) throw new Error(`Expected PostgreSQL 15, got ${version}`);
            if (count < 81) throw new Error(`Expected at least 81 app migrations, got ${count}`);
          } finally {
            await db.end();
          }
          NODE
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Create least-privilege PostgreSQL 17 backup role
        shell: bash
        run: |
          set -Eeuo pipefail
          BACKUP_DATABASE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          node --input-type=module <<'NODE'
          import { Client } from "pg";
          const password = process.env.BACKUP_DATABASE_PASSWORD;
          if (!/^[a-f0-9]{64}$/.test(password || "")) throw new Error("Invalid generated backup password");
          const db = new Client({ connectionString: process.env.DATABASE_URL });
          await db.connect();
          try {
            const exists = await db.query("SELECT 1 FROM pg_roles WHERE rolname = 'conditera_backup'");
            if (exists.rowCount === 0) await db.query("CREATE ROLE conditera_backup LOGIN");
            await db.query(`ALTER ROLE conditera_backup WITH LOGIN PASSWORD '${password}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION BYPASSRLS`);
            await db.query("GRANT CONNECT ON DATABASE conditera TO conditera_backup");
            await db.query("GRANT pg_read_all_data TO conditera_backup");
          } finally {
            await db.end();
          }
          NODE
          echo "BACKUP_DATABASE_PASSWORD=$BACKUP_DATABASE_PASSWORD" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Export generated Supabase service-role key
        shell: bash
        run: |
          KEY="$(sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' .env.local | tail -n 1)"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY was not generated by db:setup"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Start application on PostgreSQL 15
        run: |
          bun run start > /tmp/conditera-pg15-next.log 2>&1 &
          echo $! > /tmp/conditera-pg15-next.pid
          READY=0
          for i in {1..30}; do
            STATUS="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)"
            if [ "$STATUS" = "200" ]; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            tail -n 250 /tmp/conditera-pg15-next.log || true
            exit 1
          fi
        env:
          NODE_ENV: production

      - name: Verify concurrent refunds on PostgreSQL 15
        run: node scripts/verify/refund-concurrency-pg.mjs
        env:
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify complete order lifecycle on PostgreSQL 15
        run: node scripts/verify/order-lifecycle-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify checkout, idempotency, reviews and chat on PostgreSQL 15
        run: node scripts/verify/p11-hardening-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify operations, recipes and stock on PostgreSQL 15
        run: node scripts/verify/ops-center-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify product media and moderation on PostgreSQL 15
        run: node scripts/verify/product-media-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Run Playwright suite on PostgreSQL 15
        run: bunx playwright install --with-deps chromium && bun run test:e2e -- --project=chromium --project=mobile-chrome
        env:
          E2E_BASE_URL: http://localhost:3000
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: test
          CI: "true"

      - name: Print PostgreSQL 15 E2E logs on failure
        if: failure() || cancelled()
        run: tail -n 500 /tmp/conditera-pg15-next.log || true

  pg17-scenarios:
    name: PostgreSQL 17 — полный набор сценариев
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: conditera
          POSTGRES_PORT: 5432
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
          SEED_MODE: none
        ports:
          - 54323:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d conditera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      NODE_VERSION: "20"
      DATABASE_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:54323/conditera
      JWT_SECRET: e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa
      JWT_REFRESH_SECRET: e2e_test_refresh_secret_32_chars_min_aaaaaaaaaa
      TFA_ENCRYPTION_KEY: e2e_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa
      CRON_SECRET: e2e_test_cron_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3000
      SUPABASE_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
      NODE_ENV: test
      LOCAL_AUTH_STUB_ENABLED: "true"
      E2E_PAYMENT_STUB_ENABLED: "true"
      YANDEX_CLIENT_ID: e2e-yandex-client
      YANDEX_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/yandex/callback
      VK_CLIENT_ID: e2e-vk-client
      VK_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/vk/callback
      GOOGLE_CLIENT_ID: e2e-google-client
      GOOGLE_CLIENT_SECRET: e2e-google-secret
      GOOGLE_OAUTH_REDIRECT: https://conditera.ru/api/auth/oauth/google/callback
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore application build
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

      - name: Apply all migrations and seed isolated PostgreSQL 17
        run: bun run db:setup
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SEED_MODE: demo
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NODE_ENV: test

      - name: Assert PostgreSQL 17 version and exact migration ledger
        run: |
          node --input-type=module <<'NODE'
          import { Client } from "pg";
          import { readdirSync } from "node:fs";
          const expected = readdirSync("supabase/migrations").filter((name) => name.endsWith(".sql")).sort();
          const db = new Client({ connectionString: process.env.DATABASE_URL });
          await db.connect();
          try {
            const version = (await db.query("SHOW server_version")).rows[0].server_version;
            const rows = await db.query("SELECT filename FROM public.schema_migrations ORDER BY filename");
            const actual = rows.rows.map((row) => row.filename).sort();
            const missing = expected.filter((name) => !actual.includes(name));
            const unexpected = actual.filter((name) => !expected.includes(name));
            console.log(`PostgreSQL server_version=${version}; applied app migrations=${actual.length}; repository migrations=${expected.length}`);
            if (!version.startsWith("17.")) throw new Error(`Expected PostgreSQL 17, got ${version}`);
            if (missing.length || unexpected.length || actual.length !== expected.length) {
              throw new Error(JSON.stringify({ missing, unexpected, expected: expected.length, actual: actual.length }));
            }
          } finally {
            await db.end();
          }
          NODE
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify migration setup is repeatable on clean PG17
        run: |
          bun run db:setup
          node --input-type=module <<'NODE'
          import { Client } from "pg";
          import { readdirSync } from "node:fs";
          const expected = readdirSync("supabase/migrations").filter((name) => name.endsWith(".sql")).sort();
          const db = new Client({ connectionString: process.env.DATABASE_URL });
          await db.connect();
          try {
            const version = (await db.query("SHOW server_version")).rows[0].server_version;
            const rows = await db.query("SELECT filename FROM public.schema_migrations ORDER BY filename");
            const actual = rows.rows.map((row) => row.filename).sort();
            if (!version.startsWith("17.")) throw new Error(`Expected PostgreSQL 17 after repeat setup, got ${version}`);
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("Migration ledger changed or is incomplete after second db:setup");
            console.log(`PASS: repeat setup on PostgreSQL ${version}; ${actual.length} migrations remain consistent`);
          } finally {
            await db.end();
          }
          NODE
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SEED_MODE: none
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NODE_ENV: test

      - name: Export generated Supabase service-role key
        shell: bash
        run: |
          KEY="$(sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' .env.local | tail -n 1)"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY was not generated by db:setup"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build the production Docker image for PostgreSQL 17 acceptance
        run: |
          set -Eeuo pipefail
          docker build --target runner --tag conditera-web:pg17-ci \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_YANDEX_METRIKA_ID=111432662 .

      - name: Start production container against PostgreSQL 17
        run: |
          set -Eeuo pipefail
          docker rm -f conditera-web-pg17-ci >/dev/null 2>&1 || true
          docker run -d --name conditera-web-pg17-ci --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BACKUP_DATABASE_URL="postgresql://conditera_backup:${BACKUP_DATABASE_PASSWORD}@127.0.0.1:54323/conditera" \
            -e BACKUP_DIR=/app/backups \
            -e NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            -e NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e SUPABASE_INTERNAL_URL="$SUPABASE_INTERNAL_URL" \
            -e SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e TFA_ENCRYPTION_KEY="$TFA_ENCRYPTION_KEY" \
            -e CRON_SECRET="$CRON_SECRET" \
            -e LOCAL_AUTH_STUB_ENABLED=true \
            -e E2E_PAYMENT_STUB_ENABLED=true \
            -e YANDEX_CLIENT_ID="$YANDEX_CLIENT_ID" \
            -e YANDEX_OAUTH_REDIRECT="$YANDEX_OAUTH_REDIRECT" \
            -e VK_CLIENT_ID="$VK_CLIENT_ID" \
            -e VK_OAUTH_REDIRECT="$VK_OAUTH_REDIRECT" \
            -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            -e GOOGLE_OAUTH_REDIRECT="$GOOGLE_OAUTH_REDIRECT" \
            -e NEXT_PUBLIC_YANDEX_METRIKA_ID=111432662 \
            -e CI=true \
            conditera-web:pg17-ci
          READY=0
          for i in {1..45}; do
            STATUS="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)"
            if [ "$STATUS" = "200" ]; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            docker logs --tail 300 conditera-web-pg17-ci || true
            exit 1
          fi
          PG_DUMP_VERSION="$(docker exec conditera-web-pg17-ci pg_dump --version)"
          echo "$PG_DUMP_VERSION"
          echo "$PG_DUMP_VERSION" | grep -Eq 'PostgreSQL\) 17\.'

      - name: Verify concurrent refunds on PostgreSQL 17
        run: node scripts/verify/refund-concurrency-pg.mjs
        env:
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify complete order lifecycle on PostgreSQL 17
        run: node scripts/verify/order-lifecycle-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify checkout, idempotency, reviews and chat on PostgreSQL 17
        run: node scripts/verify/p11-hardening-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Verify operations, recipes, stock and production backup on PostgreSQL 17
        run: node scripts/verify/ops-center-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}
          VERIFY_BACKUP: "1"

      - name: Verify generated PostgreSQL backup archive
        run: |
          set -Eeuo pipefail
          docker exec conditera-web-pg17-ci sh -lc '
            set -eu
            backup="$(find /app/backups -maxdepth 1 -type f -name "backup-*.sql.gz" -size +0c | head -n 1)"
            test -n "$backup"
            gzip -t "$backup"
            echo "PASS: non-empty gzip backup archive is valid: $backup"
          '

      - name: Verify product media and moderation on PostgreSQL 17
        run: node scripts/verify/product-media-verify.mjs
        env:
          VERIFY_BASE: http://localhost:3000
          PGURL: ${{ env.DATABASE_URL }}

      - name: Run Playwright suite on PostgreSQL 17
        run: bunx playwright install --with-deps chromium && bun run test:e2e -- --project=chromium --project=mobile-chrome
        env:
          E2E_BASE_URL: http://localhost:3000
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: test
          CI: "true"

      - name: Print PostgreSQL 17 production container logs on failure
        if: failure() || cancelled()
        run: docker logs --tail 500 conditera-web-pg17-ci || true

      - name: Remove PostgreSQL 17 production container
        if: always()
        run: docker rm -f conditera-web-pg17-ci >/dev/null 2>&1 || true

  # ===== 4. Отчёт в Slack/Telegram (опционально) =====
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram notification
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔴 E2E Tests FAILED

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Failed job: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
