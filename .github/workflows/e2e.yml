# ============================================================
# E2E Tests — отдельный workflow для расширенного запуска Playwright
# (v2.0: bun, без Prisma — клиент генерируется из Supabase-типов)
# ============================================================
# Запускается:
#   • По расписанию: nightly в 03:00 UTC
#   • При изменениях в API routes или e2e тестах
#   • Вручную (workflow_dispatch) с фильтром grep
#
# Pipeline: install → build → start preview → run Playwright → upload report
#
# Отличие от ci.yml:
#   • Запускается отдельно (не блокирует основной CI)
#   • Загружает HTML-отчёт как артефакт
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА (variant B, 2026-10-15): матрица зафиксирована на chromium.
# playwright.config.ts активирует только chromium + mobile-chrome — проекты
# firefox/webkit закомментированы, поэтому nightly-джобы этих браузеров падали
# с "project not found" независимо от состояния БД (run 38701876670).
# TODO(future-task): полноценное покрытие Firefox/WebKit — раскомментировать
# проекты в playwright.config.ts, прогнать спеки на обоих движках и только
# после этого вернуть их в матрицу (и опцию "all" в workflow_dispatch).
# ============================================================

name: E2E Tests

on:
  schedule:
    # Nightly в 03:00 UTC — chromium-only (см. «РЕШЕНИЕ ВЛАДЕЛЬЦА» в шапке)
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      # Параметр browser (firefox/webkit/all) удалён: проекты не активированы
      # в playwright.config.ts — интерфейс не должен предлагать неподдерживаемые
      # варианты. Вернуть вместе с TODO(future-task) из шапки.
      grep:
        description: "Фильтр тестов (regex, пусто = все)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main
      - develop
    paths:
      # Запускать только при изменениях в коде, который тестируется e2e
      - "src/app/api/**"
      - "src/components/**"
      - "src/lib/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/app/api/**"
      - "src/components/**"
      - "src/lib/**"
      - "tests/e2e/**"
      - "playwright.config.ts"

env:
  NODE_VERSION: "20"
  # Локальный PostgreSQL (embedded, без Docker) — источник данных для шима
  # /rest/v1 и всех API. Раньше здесь был legacy file:./db/e2e-test.db, а саму
  # БД никто не поднимал — все API-тесты E2E падали (53+ ошибок CI).
  DATABASE_URL: "postgresql://postgres@127.0.0.1:54329/conditera"
  JWT_SECRET: "e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa"
  TFA_ENCRYPTION_KEY: "e2e_test_tfa_key_64_hex_chars_aaaaaaaaaaaaaaaaaaaaaaaa"
  CRON_SECRET: "e2e_test_cron_secret"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"
  NODE_ENV: test
  CI: "true"

jobs:
  # ===== 1. Установка и сборка =====
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build application
        run: bun run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: Cache build for downstream
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

  # ===== 2. Запуск Playwright тестов =====
  test:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        # Фиксированная матрица (variant B, решение владельца 2026-10-15):
        # единственный активный проект Playwright. Nightly и ручной запуск —
        # только chromium до активации firefox/webkit (TODO в шапке файла).
        browser: ["chromium"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap embedded PostgreSQL + migrations + seed
        run: |
          node scripts/db/runtime.mjs start
          bun run db:setup
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:54329/conditera
          JWT_SECRET: e2e_test_jwt_secret_32_chars_min_aaaaaaaaaa

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .next
          key: nextjs-build-${{ github.sha }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Start application
        run: |
          bun run start &
          # Ждём пока приложение поднимется
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health | grep -q "200"; then
              echo "✓ Application is up"
              break
            fi
            echo "  Waiting for app to start... ($i/30)"
            sleep 2
          done
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: Run Playwright tests
        run: |
          # E2E_GREP передаётся через env (см. блок env ниже), а не текстуальной
          # ${{ }}-подстановкой: расширение "$E2E_GREP" внутри bash-массива не
          # ре-парсится shell'ом — ввод dispatch не разорвёт кавычки и не
          # внедрит команды (защита от shell injection, TZ v4.0 §6).
          ARGS=(--project=${{ matrix.browser }})
          if [ -n "$E2E_GREP" ]; then
            ARGS+=(--grep "$E2E_GREP")
          fi
          bun run test:e2e -- "${ARGS[@]}"
        env:
          # Сервер уже запущен предыдущим шагом — запрещаем playwright
          # поднимать собственный webServer (иначе конфликт порта 3000).
          # 127.0.0.1 (не localhost): Node ≥17 резолвит localhost в ::1,
          # сервер слушает 0.0.0.0 — API-тесты падали с ECONNREFUSED ::1:3000
          E2E_BASE_URL: http://127.0.0.1:3000
          # Фильтр grep через env вместо inline-подстановки — защита от shell
          # injection/разрыва кавычек при workflow_dispatch.
          E2E_GREP: ${{ github.event.inputs.grep }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TFA_ENCRYPTION_KEY: ${{ env.TFA_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}
          CI: "true"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (XML)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: test-results/**/test-video.webm
          retention-days: 7

  # ===== 3. Отчёт в Slack/Telegram (опционально) =====
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram notification
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔴 E2E Tests FAILED

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Failed job: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
