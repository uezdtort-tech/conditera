name: Inspect Supabase service image contracts

on:
  pull_request:
    paths:
      - "scripts/ops/inspect-supabase-images.sh"
      - ".github/workflows/inspect-supabase-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-pinned-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect pinned Supabase images
        run: |
          bash -n scripts/ops/inspect-supabase-images.sh
          bash scripts/ops/inspect-supabase-images.sh ./artifacts/supabase-image-contract
      - name: Upload image contract report
        uses: actions/upload-artifact@v7
        with:
          name: supabase-image-contract
          path: artifacts/supabase-image-contract/
          retention-days: 7
