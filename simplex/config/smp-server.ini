# SimpleX SMP server configuration (v7)
# Документация: https://github.com/simplex-chat/simplex-chat/blob/stable/protocol/simplex-messaging.md
# Этот файл монтируется в /etc/opt/simplex/ в контейнере smp-server

[TRANSPORT]
# Порт, который слушает SMP-сервер (TCP+TLS)
port = 5223

# Размер квоты сообщений (in-memory)
# Сообщения удаляются после доставки адресату
message_size_limit = 16384  # 16 КБ

[STORE_LOG]
# Включить journal-лог на диск (для персистентности между рестартами)
enabled = true

[SERVER]
# Указывается через PUBLIC_HOSTNAME env var в docker-compose
# public_hostname = smp.conditera.ru

# Уровень логирования: error | warn | info | debug
log_level = info

# Контрольная сумма сертификата — автоматически генерируется при первом запуске
# Не указывать вручную — сервер создаст сам

[INACTIVE_CLIENTS]
# Удалять неактивных клиентов через 30 дней
disconnect = true

# TTL для очередей сообщений (секунды)
# 30 дней = 2592000
ttl = 2592000
