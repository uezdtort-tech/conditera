# Изолированный целевой Supabase PostgreSQL 17 для миграционной репетиции.
#
# Запускать ТОЛЬКО вместе с docker-compose.supabase.yml:
# docker compose -f docker-compose.supabase.yml -f docker-compose.pg17-migration.yml \
#   --profile pg17-migration up -d supabase-db-pg17-migration
#
# Сервис не заменяет действующий supabase-db, не подключается к его volume
# и не принимает трафик приложения. Он создаёт отдельный чистый целевой кластер
# для проверки совместимости и восстановления копий. Переключение выполняется
# отдельным изменением Compose только после сверки данных и E2E-проверок.
#
# Не использовать с production-трафиком и не удалять volume без отдельного
# подтверждённого плана отката.

services:
  supabase-db-pg17-migration:
    image: supabase/postgres:17.12.0.001
    container_name: conditera-supabase-db-pg17-migration
    profiles: ["pg17-migration"]
    restart: "no"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - cron.database_name=supabase
      - -c
      - cron.username=supabase_admin
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: supabase
      POSTGRES_PORT: 5432
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      MIGRATIONS_DIR: /conditera-migrations
      SEEDS_DIR: /docker-entrypoint-initdb.d/seed
      SEED_MODE: none
    expose:
      - "5432"
    volumes:
      - supabase_pg17_migration_data:/var/lib/postgresql/data
      - ./supabase/init-scripts/00-service-role-passwords.sh:/docker-entrypoint-initdb.d/zz-conditera-00-role-passwords.sh:ro
      - ./supabase/init-scripts/01-apply-migrations.sh:/docker-entrypoint-initdb.d/zz-conditera-apply-migrations.sh:ro
      - ./supabase/init-scripts/02-realtime-schema.sql:/docker-entrypoint-initdb.d/zz-conditera-realtime-schema.sql:ro
      - ./supabase/migrations:/conditera-migrations:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/seed/01-seed.sql:ro
      - ./supabase/seed_cms_crm.sql:/docker-entrypoint-initdb.d/seed/02-seed_cms_crm.sql:ro
      - ./supabase/seed_fillings.sql:/docker-entrypoint-initdb.d/seed/03-seed_fillings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U supabase_admin -d supabase"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pg17-migration-net

  # Supabase services for the isolated PG17 rehearsal. They create the real
  # Storage schema before the deferred Conditera migration 0026 is applied.
  supabase-rest-pg17-migration:
    image: postgrest/postgrest:v12.2.0
    container_name: conditera-supabase-rest-pg17-migration
    profiles: ["pg17-migration"]
    restart: "no"
    environment:
      PGRST_DB_URI: postgres://supabase_admin:${POSTGRES_PASSWORD}@supabase-db-pg17-migration:5432/supabase
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      supabase-db-pg17-migration:
        condition: service_healthy
    networks:
      - pg17-migration-net

  supabase-meta-pg17-migration:
    image: supabase/postgres-meta:v0.83.2
    container_name: conditera-supabase-meta-pg17-migration
    profiles: ["pg17-migration"]
    restart: "no"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db-pg17-migration
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: supabase
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PG_META_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
    depends_on:
      supabase-db-pg17-migration:
        condition: service_healthy
    networks:
      - pg17-migration-net

  supabase-storage-pg17-migration:
    image: supabase/storage-api:v1.14.5
    container_name: conditera-supabase-storage-pg17-migration
    profiles: ["pg17-migration"]
    restart: on-failure
    environment:
      ANON_KEY: ${ANON_KEY:?ANON_KEY required}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY required}
      POSTGREST_URL: http://supabase-rest-pg17-migration:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db-pg17-migration:5432/supabase?search_path=storage
      PG_META_URL: http://supabase-meta-pg17-migration:8080
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /mnt/storage
      TENANT_ID: conditera
      REGION: us-east-1
      GLOBAL_S3_BUCKET: conditera-storage
      GLOBAL_S3_ENDPOINT: http://supabase-storage-pg17-migration:5000
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase_pg17_migration_storage_data:/mnt/storage
    depends_on:
      supabase-db-pg17-migration:
        condition: service_healthy
      supabase-rest-pg17-migration:
        condition: service_started
      supabase-meta-pg17-migration:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pg17-migration-net

  supabase-app-migrator-pg17-migration:
    image: supabase/postgres:17.12.0.001
    container_name: conditera-supabase-app-migrator-pg17-migration
    profiles: ["pg17-migration"]
    restart: "no"
    command: ["/bin/bash", "/scripts/01-apply-migrations.sh"]
    environment:
      PGHOST: supabase-db-pg17-migration
      PGPORT: 5432
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATABASE: supabase
      MIGRATIONS_DIR: /conditera-migrations
      SEEDS_DIR: /seeds
      SEED_MODE: none
    volumes:
      - ./supabase/init-scripts/01-apply-migrations.sh:/scripts/01-apply-migrations.sh:ro
      - ./supabase/migrations:/conditera-migrations:ro
    depends_on:
      supabase-db-pg17-migration:
        condition: service_healthy
      supabase-storage-pg17-migration:
        condition: service_healthy
    networks:
      - pg17-migration-net


  # Auth и Realtime подключаются к тому же PG17 кластеру, без второго DB runtime.
  supabase-auth-pg17-migration:
    image: supabase/gotrue:v2.164.0
    container_name: conditera-supabase-auth-pg17-migration
    profiles: ["pg17-migration"]
    restart: on-failure
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db-pg17-migration:5432/supabase?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_ENABLE_ANONYMOUS_SIGNUPS: "false"
      GOTRUE_ENABLE_SIGNUP: "true"
      GOTRUE_ENABLE_EMAIL_SIGNUP: "true"
      GOTRUE_ENABLE_EMAIL_AUTOCONFIRM: "true"
      GOTRUE_ENABLE_SMS_SIGNUP: "false"
      GOTRUE_ENABLE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/confirmation
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/invite
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/recovery
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/email-change-confirmation
      GOTRUE_MAILER_TEMPLATES_INVITE: /etc/gotrue/templates/invite.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: /etc/gotrue/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: /etc/gotrue/templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: /etc/gotrue/templates/email_change.html
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-noreply@conditera.ru}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:-}
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_GROUPS: admin
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:8000}/auth/v1/callback
      GOTRUE_EXTERNAL_YANDEX_ENABLED: ${EXTERNAL_YANDEX_ENABLED:-false}
      GOTRUE_EXTERNAL_YANDEX_CLIENT_ID: ${EXTERNAL_YANDEX_CLIENT_ID:-}
      GOTRUE_EXTERNAL_YANDEX_SECRET: ${EXTERNAL_YANDEX_SECRET:-}
      GOTRUE_EXTERNAL_YANDEX_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:8000}/auth/v1/callback
      GOTRUE_EXTERNAL_VK_ENABLED: ${EXTERNAL_VK_ENABLED:-false}
      GOTRUE_EXTERNAL_VK_CLIENT_ID: ${EXTERNAL_VK_CLIENT_ID:-}
      GOTRUE_EXTERNAL_VK_SECRET: ${EXTERNAL_VK_SECRET:-}
      GOTRUE_EXTERNAL_VK_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:8000}/auth/v1/callback
    depends_on:
      supabase-db-pg17-migration:
        condition: service_healthy
    networks:
      - pg17-migration-net

  supabase-realtime-pg17-migration:
    image: supabase/realtime:v2.34.21
    container_name: conditera-supabase-realtime-pg17-migration
    profiles: ["pg17-migration"]
    restart: on-failure
    environment:
      APP_NAME: realtime
      DB_HOST: supabase-db-pg17-migration
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DB_NAME: supabase
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      PORT: 4000
      RLIMIT_NOFILE: 65536
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTOR_KEY: ${ENCRYPTOR_KEY:?ENCRYPTOR_KEY required}
      API_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      REPLICATION_MODE: RLS
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE required}
      ERL_AFLAGS: +sbwt none +sbwtdcpu none +sbwtdio none
      DB_ENC_KEY: ${ENCRYPTOR_KEY:?ENCRYPTOR_KEY required}
    depends_on:
      supabase-db-pg17-migration:
        condition: service_healthy
    networks:
      - pg17-migration-net


volumes:
  supabase_pg17_migration_data:
    name: conditera_supabase_pg17_migration_data

  supabase_pg17_migration_storage_data:
    name: conditera_supabase_pg17_migration_storage_data

networks:
  pg17-migration-net:
    name: conditera-pg17-migration-net
    driver: bridge
    internal: true
