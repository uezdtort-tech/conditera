# Изолированный целевой Supabase PostgreSQL 17 для миграционной репетиции.
#
# Запускать ТОЛЬКО вместе с docker-compose.supabase.yml:
# docker compose -f docker-compose.supabase.yml -f docker-compose.pg17-migration.yml \
#   --profile pg17-migration up -d supabase-db-pg17-migration
#
# Сервис не заменяет действующий supabase-db, не подключается к его volume,
# не подключён к сети приложения и не принимает трафик приложения. Он создаёт отдельный чистый целевой кластер
# для проверки совместимости и восстановления копий. При первом старте не запускаются прикладные миграции и seed-данные: сначала восстанавливается согласованная копия реальной БД. Переключение выполняется
# отдельным изменением Compose только после сверки данных и E2E-проверок.
#
# В CI проверяются раздельные volumes, отсутствие публикации порта и изолированная сеть.
# Не использовать с production-трафиком и не удалять volume без отдельного
# подтверждённого плана отката.

services:
  supabase-db-pg17-migration:
    image: supabase/postgres:17.12.0.001
    container_name: conditera-supabase-db-pg17-migration
    profiles: ["pg17-migration"]
    restart: "no"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: supabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: supabase
      POSTGRES_PORT: 5432
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    expose:
      - "5432"
    volumes:
      - supabase_pg17_migration_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase -d supabase"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pg17-migration-net

volumes:
  supabase_pg17_migration_data:
    name: conditera_supabase_pg17_migration_data

networks:
  pg17-migration-net:
    name: conditera-pg17-migration-net
    driver: bridge
    internal: true
