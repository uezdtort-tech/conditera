[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
childlogdir=/tmp
user=root
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -D /etc/postgresql
priority=10
autostart=true
autorestart=unexpected
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=60
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gotrue]
command=/usr/local/bin/wait-for-postgres-and-run-auth.sh
user=supabase
priority=20
autostart=true
autorestart=unexpected
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
