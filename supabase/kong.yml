# Kong declarative configuration — маршрутизация запросов внутри Supabase stack
# Документация: https://docs.konghq.com/2.8.x/db-less-and-declarative-config/

_format_version: "2.1"
_transform: true

services:
  # ===== Auth (GoTrue) =====
  - name: auth-v1
    url: http://supabase-auth:9999
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, X-Client-Info]
          credentials: true

  # ===== REST (PostgREST) =====
  - name: rest-v1
    url: http://supabase-rest:3000
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, X-Client-Info]
          credentials: true

  # ===== Realtime =====
  - name: realtime-v1
    url: http://supabase-realtime:4000
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, X-Client-Info]
          credentials: true

  # ===== Storage =====
  - name: storage-v1
    url: http://supabase-storage:5000
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, X-Client-Info]
          credentials: true

  # ===== postgres-meta =====
  - name: meta
    url: http://supabase-meta:8080
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: true
          key_names: [apikey]

# ===== Глобальные consumers для API keys =====
consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

# ===== ACL плагины =====
plugins:
  - name: acl
    service: rest-v1
    config:
      allow: [anon, service_role]
      hide_groups: true

  - name: acl
    service: storage-v1
    config:
      allow: [anon, service_role]
      hide_groups: true

  - name: acl
    service: realtime-v1
    config:
      allow: [anon, service_role]
      hide_groups: true

  # Rate limiting для auth — защита от brute force
  - name: rate-limiting
    service: auth-v1
    config:
      minute: 30
      hour: 500
      policy: local
      fault_tolerant: true
      hide_client_headers: false
