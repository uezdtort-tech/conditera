# ===== Docker Compose для dev-режима =====
# Запуск: docker-compose -f docker-compose.dev.yml up -d
#
# Включает: PostgreSQL 17 + Redis + Meilisearch + Mailpit + n8n
# Next.js запускается отдельно через `npm run dev:local`

services:
  # ===== PostgreSQL 17 (основной dev-контур) =====
  # Новый volume изолирован от прежних данных PG18.
  # Старый volume сохранён отдельным профилем pg18-legacy — ничего не удаляется.
  db-dev:
    image: supabase/postgres:17.12.0.001
    container_name: uyezdny-db-dev
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - cron.database_name=uyezdny_konditer_dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: uyezdny_dev_pass
      POSTGRES_DB: uyezdny_konditer_dev
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - uyezdny-db-dev-data-v17:/var/lib/postgresql/data
      - uyezdny-db-dev-config-v17:/etc/postgresql-custom
      - ./supabase/pg17-init/00000000000000-initial-schema.sql:/docker-entrypoint-initdb.d/init-scripts/00000000000000-initial-schema.sql:ro
      - ./supabase/pg17-init/00000000000002-storage-schema.sql:/docker-entrypoint-initdb.d/init-scripts/00000000000002-storage-schema.sql:ro
      - ./supabase/pg17-init/00000000000003-post-setup.sql:/docker-entrypoint-initdb.d/init-scripts/00000000000003-post-setup.sql:ro
      - ./supabase/pg17-init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/pg17-init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./supabase/pg17-init/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./supabase/pg17-init/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./supabase/pg17-init/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/pg17-init/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./supabase/pg17-init/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - ./scripts/db/ensure-supabase-init.sh:/docker-entrypoint-initdb.d/zz-00-supabase-init.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d uyezdny_konditer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10


  # Storage API performs its own versioned tenant migrations on startup.
  supabase-storage-dev:
    image: supabase/storage-api:v1.14.5
    container_name: uyezdny-storage-dev
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY:-dev-anon-key}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-dev-service-role-key}
      POSTGREST_URL: http://127.0.0.1:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-characters-min}
      DATABASE_URL: postgres://supabase_admin:uyezdny_dev_pass@db-dev:5432/uyezdny_konditer_dev?search_path=storage
      PG_META_URL: http://127.0.0.1:8080
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /mnt/storage
      TENANT_ID: uyezdny-dev
      REGION: us-east-1
      GLOBAL_S3_BUCKET: uyezdny-dev-storage
      GLOBAL_S3_ENDPOINT: http://127.0.0.1:5000
      ENABLE_IMAGE_TRANSFORMATION: "false"
      DB_INSTALL_ROLES: "false"
      DB_SUPER_USER: supabase_admin
      DB_ANON_ROLE: anon
      DB_AUTHENTICATED_ROLE: authenticated
      DB_SERVICE_ROLE: service_role
    volumes:
      - uyezdny-storage-dev-data:/mnt/storage
    depends_on:
      db-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Apply Conditera migrations only after Storage API migrations complete.
  conditera-migrator-dev:
    image: supabase/postgres:17.12.0.001
    container_name: uyezdny-migrator-dev
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command: "bash /scripts/docker-dev-init.sh"
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: uyezdny_dev_pass
      POSTGRES_DB: uyezdny_konditer_dev
      PGHOST: db-dev
      PGPORT: 5432
      CONDITERA_DB_PASSWORD: uyezdny_dev_pass
      MIGRATIONS_DIR: /migrations
      SEEDS_DIR: /seeds
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seeds/01-seed.sql:ro
      - ./supabase/seed_cms_crm.sql:/seeds/02-seed_cms_crm.sql:ro
      - ./supabase/seed_fillings.sql:/seeds/03-seed_fillings.sql:ro
      - ./supabase/init-scripts/01-apply-migrations.sh:/scripts/01-apply-migrations.sh:ro
      - ./scripts/db/docker-dev-init.sh:/scripts/docker-dev-init.sh:ro
    depends_on:
      db-dev:
        condition: service_healthy
      supabase-storage-dev:
        condition: service_healthy

  # ===== PostgreSQL 18 (только чтение старого dev-volume/перенос данных) =====
  # Запуск: docker compose -f docker-compose.dev.yml --profile pg18-legacy up -d db-dev-pg18
  # Старый volume v18 остаётся доступен и не подключается к PG17.
  db-dev-pg18:
    image: postgres:18-alpine
    container_name: uyezdny-db-dev-pg18
    profiles: ["pg18-legacy"]
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: uyezdny
      POSTGRES_PASSWORD: uyezdny_dev_pass
      POSTGRES_DB: uyezdny_konditer_dev
    volumes:
      - uyezdny-db-dev-data-v18:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyezdny -d uyezdny_konditer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== Redis (для сессий/кэша/rate-limiting) =====
  redis-dev:
    image: redis:7-alpine
    container_name: uyezdny-redis-dev
    ports:
      - "6380:6379"
    restart: unless-stopped

  # ===== Meilisearch (полнотекстовый поиск) =====
  meilisearch-dev:
    image: getmeili/meilisearch:v1.12
    container_name: uyezdny-meilisearch-dev
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev_meili_key_32_chars_min_aaaaaa
      MEILI_DB_PATH: /meili_data
    volumes:
      - uyezdny-meili-dev-data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===== Mailpit (почтовый сервер для dev — перехват писем) =====
  mailpit-dev:
    image: axllent/mailpit:latest
    container_name: uyezdny-mailpit-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI (просмотр писем в браузере)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  # ===== n8n (автоматизация: брошенная корзина, дайджест, бонусы, AI) =====
  n8n-dev:
    image: n8nio/n8n:latest
    container_name: uyezdny-n8n-dev
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Moscow
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_ENCRYPTION_KEY=dev_n8n_encryption_key_32_chars
      # App URL для cron-задач (URL нашего Next.js API)
      - APP_URL=http://host.docker.internal:3000
      # CRON_SECRET для авторизации cron-API запросов
      - CRON_SECRET=dev_cron_secret_change_me_24chars
      # AI / LLM settings (Ollama / LM Studio)
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LM_STUDIO_HOST=http://host.docker.internal:1234
      - LLM_MODEL=qwen2.5:7b
    volumes:
      - uyezdny-n8n-dev-data:/home/node/.n8n
      - ./n8n-workflows:/imports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  uyezdny-db-dev-data-v17:
  uyezdny-db-dev-config-v17:
  uyezdny-db-dev-data-v18:
  uyezdny-storage-dev-data:
  uyezdny-meili-dev-data:
  uyezdny-n8n-dev-data:
